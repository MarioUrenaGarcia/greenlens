[features_title]
other = "What GreenLens does"
[f_measure_title]
other = "Measure"
[f_measure_body]
other = "Reads the energy counters of CPUs, memory and GPUs from the Linux kernel and declares the quality of every value: measured, attributed or estimated."
[f_attribute_title]
other = "Attribute"
[f_attribute_body]
other = "Splits the energy of the node between inference backends, models and teams, using process CPU time, GPU usage and token counts."
[f_report_title]
other = "Report"
[f_report_body]
other = "Turns energy into kWh, gCO2e and cost per backend, model and generated token, and projects the savings of switching models."
[principles_title]
other = "Design principles"
[p_local]
other = "Local first: every value is computed and stored on your machine."
[p_telemetry]
other = "No telemetry and no outbound connections by default."
[p_privacy]
other = "Prompts and responses are never stored or logged; the proxy reads only their token counts."
[p_root]
other = "The agent runs without root and confines its own file access with Landlock."
[p_honest]
other = "Every number comes with its unit, method and quality."
[p_core]
other = "One core, three interfaces: command line, terminal interface and graphical interface."
