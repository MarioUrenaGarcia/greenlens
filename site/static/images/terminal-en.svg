<text x="387.4" y="22" text-anchor="middle" class="m">greenlens</text>
<clipPath id="screen"><rect x="0" y="48.0" width="775" height="368.0"/></clipPath>
<g clip-path="url(#screen)"><g class="scroll">
<g class="s0"><text x="22.0" y="68.0" class="p">$</text><text x="38.8" y="68.0" class="c" textLength="134.4" lengthAdjust="spacingAndGlyphs">greenlens --help</text><g class="t0"><rect x="38.8" y="54.0" width="151.2" height="20.0" fill="#0A1F17"/><rect class="cur" x="38.8" y="56.0" width="8.4" height="16.0" fill="#E8F7EF" fill-opacity=".8"/></g></g>
<text x="22.0" y="88.0" class="o s1" textLength="663.6" lengthAdjust="spacingAndGlyphs">GreenLens measures, attributes and reports the energy, emissions and cost of AI</text>
<text x="22.0" y="108.0" class="o s2" textLength="268.8" lengthAdjust="spacingAndGlyphs">models that run on this machine.</text>
<text x="22.0" y="148.0" class="o s4" textLength="50.4" lengthAdjust="spacingAndGlyphs">Usage:</text>
<text x="22.0" y="168.0" class="o s5" textLength="159.6" lengthAdjust="spacingAndGlyphs">  greenlens [flags]</text>
<text x="22.0" y="188.0" class="o s6" textLength="176.4" lengthAdjust="spacingAndGlyphs">  greenlens [command]</text>
<text x="22.0" y="228.0" class="o s8" textLength="159.6" lengthAdjust="spacingAndGlyphs">Available commands:</text>
<text x="22.0" y="248.0" class="o s9" textLength="310.8" lengthAdjust="spacingAndGlyphs">  help        Show help for a command</text>
<text x="22.0" y="268.0" class="o s10" textLength="403.2" lengthAdjust="spacingAndGlyphs">  version     Show version and build information</text>
<text x="22.0" y="308.0" class="o s12" textLength="50.4" lengthAdjust="spacingAndGlyphs">Flags:</text>
<text x="22.0" y="328.0" class="o s13" textLength="361.2" lengthAdjust="spacingAndGlyphs">  -h, --help        Show help for greenlens</text>
<text x="22.0" y="348.0" class="o s14" textLength="596.4" lengthAdjust="spacingAndGlyphs">      --lang code   Language for messages (code: en or es). Defaults to</text>
<text x="22.0" y="368.0" class="o s15" textLength="310.8" lengthAdjust="spacingAndGlyphs">                    the system locale</text>
<text x="22.0" y="408.0" class="o s17" textLength="588.0" lengthAdjust="spacingAndGlyphs">Run &#39;greenlens [command] --help&#39; for more information about a command.</text>
<g class="s19"><text x="22.0" y="448.0" class="p">$</text><text x="38.8" y="448.0" class="c" textLength="134.4" lengthAdjust="spacingAndGlyphs">greenlens verson</text><g class="t19"><rect x="38.8" y="434.0" width="151.2" height="20.0" fill="#0A1F17"/><rect class="cur" x="38.8" y="436.0" width="8.4" height="16.0" fill="#E8F7EF" fill-opacity=".8"/></g></g>
<text x="22.0" y="468.0" class="e s20" textLength="319.2" lengthAdjust="spacingAndGlyphs">error GL0002: unknown command &#39;verson&#39;</text>
<text x="22.0" y="488.0" class="m s21" textLength="411.6" lengthAdjust="spacingAndGlyphs">  cause: &#39;verson&#39; is not a command of &#39;greenlens&#39;</text>
<text x="22.0" y="508.0" class="m s22" textLength="722.4" lengthAdjust="spacingAndGlyphs">  fix:   did you mean &#39;version&#39;? Run &#39;greenlens --help&#39; to list the available commands</text>
<g class="s24"><text x="22.0" y="548.0" class="p">$</text><text x="38.8" y="548.0" class="c" textLength="201.6" lengthAdjust="spacingAndGlyphs">greenlens version --nope</text><g class="t24"><rect x="38.8" y="534.0" width="218.4" height="20.0" fill="#0A1F17"/><rect class="cur" x="38.8" y="536.0" width="8.4" height="16.0" fill="#E8F7EF" fill-opacity=".8"/></g></g>
<text x="22.0" y="568.0" class="e s25" textLength="294.0" lengthAdjust="spacingAndGlyphs">error GL0003: unknown flag &#39;--nope&#39;</text>
<text x="22.0" y="588.0" class="m s26" textLength="520.8" lengthAdjust="spacingAndGlyphs">  cause: &#39;greenlens version&#39; does not accept the flag &#39;--nope&#39;</text>
<text x="22.0" y="608.0" class="m s27" textLength="554.4" lengthAdjust="spacingAndGlyphs">  fix:   run &#39;greenlens version --help&#39; to list the accepted flags</text>
</g></g>
</svg>
