<text x="387.4" y="22" text-anchor="middle" class="m">greenlens</text>
<clipPath id="screen"><rect x="0" y="48.0" width="775" height="368.0"/></clipPath>
<g clip-path="url(#screen)"><g class="scroll">
<g class="s0"><text x="22.0" y="68.0" class="p">$</text><text x="38.8" y="68.0" class="c" textLength="134.4" lengthAdjust="spacingAndGlyphs">greenlens --help</text><g class="t0"><rect x="38.8" y="54.0" width="151.2" height="20.0" fill="#0A1F17"/><rect class="cur" x="38.8" y="56.0" width="8.4" height="16.0" fill="#E8F7EF" fill-opacity=".8"/></g></g>
<text x="22.0" y="88.0" class="o s1" textLength="663.6" lengthAdjust="spacingAndGlyphs">GreenLens measures, attributes and reports the energy, emissions and cost of AI</text>
<text x="22.0" y="108.0" class="o s2" textLength="268.8" lengthAdjust="spacingAndGlyphs">models that run on this machine.</text>
<text x="22.0" y="148.0" class="o s4" textLength="50.4" lengthAdjust="spacingAndGlyphs">Usage:</text>
<text x="22.0" y="168.0" class="o s5" textLength="159.6" lengthAdjust="spacingAndGlyphs">  greenlens [flags]</text>
<text x="22.0" y="188.0" class="o s6" textLength="176.4" lengthAdjust="spacingAndGlyphs">  greenlens [command]</text>
<text x="22.0" y="228.0" class="o s8" textLength="159.6" lengthAdjust="spacingAndGlyphs">Available commands:</text>
<text x="22.0" y="248.0" class="o s9" textLength="361.2" lengthAdjust="spacingAndGlyphs">  agent             Run the measuring agent</text>
<text x="22.0" y="268.0" class="o s10" textLength="428.4" lengthAdjust="spacingAndGlyphs">  bench             Benchmark the energy of a model</text>
<text x="22.0" y="288.0" class="o s11" textLength="478.8" lengthAdjust="spacingAndGlyphs">  calibrate         Measure the idle power of the machine</text>
<text x="22.0" y="308.0" class="o s12" textLength="638.4" lengthAdjust="spacingAndGlyphs">  compare           Compare the energy per token of two models or benchmarks</text>
<text x="22.0" y="328.0" class="o s13" textLength="428.4" lengthAdjust="spacingAndGlyphs">  completion        Print a shell completion script</text>
<text x="22.0" y="348.0" class="o s14" textLength="462.0" lengthAdjust="spacingAndGlyphs">  config            Validate and show the configuration</text>
<text x="22.0" y="368.0" class="o s15" textLength="512.4" lengthAdjust="spacingAndGlyphs">  doctor            Diagnose the energy sources and the setup</text>
<text x="22.0" y="388.0" class="o s16" textLength="445.2" lengthAdjust="spacingAndGlyphs">  explain           Explain a value GreenLens reports</text>
<text x="22.0" y="408.0" class="o s17" textLength="361.2" lengthAdjust="spacingAndGlyphs">  help              Show help for a command</text>
<text x="22.0" y="428.0" class="o s18" textLength="672.0" lengthAdjust="spacingAndGlyphs">  measure           Measure the energy of a command, a process or a systemd unit</text>
<text x="22.0" y="448.0" class="o s19" textLength="520.8" lengthAdjust="spacingAndGlyphs">  proxy             Show the state of the token-counting proxy</text>
<text x="22.0" y="468.0" class="o s20" textLength="579.6" lengthAdjust="spacingAndGlyphs">  report            Report the energy, emissions and cost of a period</text>
<text x="22.0" y="488.0" class="o s21" textLength="588.0" lengthAdjust="spacingAndGlyphs">  setup-permissions Let the agent read the energy sensors without root</text>
<text x="22.0" y="508.0" class="o s22" textLength="546.0" lengthAdjust="spacingAndGlyphs">  status            Show the power and state of the running agent</text>
<text x="22.0" y="528.0" class="o s23" textLength="571.2" lengthAdjust="spacingAndGlyphs">  top               Show the power of the node and its backends live</text>
<text x="22.0" y="548.0" class="o s24" textLength="453.6" lengthAdjust="spacingAndGlyphs">  version           Show version and build information</text>
<text x="22.0" y="588.0" class="o s26" textLength="50.4" lengthAdjust="spacingAndGlyphs">Flags:</text>
<text x="22.0" y="608.0" class="o s27" textLength="462.0" lengthAdjust="spacingAndGlyphs">      --config file     Configuration file. Defaults to</text>
<text x="22.0" y="628.0" class="o s28" textLength="596.4" lengthAdjust="spacingAndGlyphs">                        /etc/greenlens/greenlens.yaml, then the file of</text>
<text x="22.0" y="648.0" class="o s29" textLength="268.8" lengthAdjust="spacingAndGlyphs">                        the user</text>
<text x="22.0" y="668.0" class="o s30" textLength="394.8" lengthAdjust="spacingAndGlyphs">  -h, --help            Show help for greenlens</text>
<text x="22.0" y="688.0" class="o s31" textLength="604.8" lengthAdjust="spacingAndGlyphs">      --lang code       Language for messages (code: en or es). Defaults</text>
<text x="22.0" y="708.0" class="o s32" textLength="369.6" lengthAdjust="spacingAndGlyphs">                        to the system locale</text>
<text x="22.0" y="728.0" class="o s33" textLength="646.8" lengthAdjust="spacingAndGlyphs">      --no-color        Do not color the output; NO_COLOR has the same effect</text>
<text x="22.0" y="748.0" class="o s34" textLength="604.8" lengthAdjust="spacingAndGlyphs">  -o, --output format   Output format (format: table, json, csv or yaml)</text>
<text x="22.0" y="768.0" class="o s35" textLength="344.4" lengthAdjust="spacingAndGlyphs">                        (default &#34;table&#34;)</text>
<text x="22.0" y="788.0" class="o s36" textLength="613.2" lengthAdjust="spacingAndGlyphs">  -q, --quiet           Print only the result, without progress or advice</text>
<text x="22.0" y="808.0" class="o s37" textLength="663.6" lengthAdjust="spacingAndGlyphs">      --raw             Show values in base units (J, W, g) with full precision</text>
<text x="22.0" y="828.0" class="o s38" textLength="663.6" lengthAdjust="spacingAndGlyphs">  -v, --verbose         Print details of every step, such as sensor read errors</text>
<text x="22.0" y="868.0" class="o s40" textLength="588.0" lengthAdjust="spacingAndGlyphs">Run &#39;greenlens [command] --help&#39; for more information about a command.</text>
<g class="s42"><text x="22.0" y="908.0" class="p">$</text><text x="38.8" y="908.0" class="c" textLength="134.4" lengthAdjust="spacingAndGlyphs">greenlens verson</text><g class="t42"><rect x="38.8" y="894.0" width="151.2" height="20.0" fill="#0A1F17"/><rect class="cur" x="38.8" y="896.0" width="8.4" height="16.0" fill="#E8F7EF" fill-opacity=".8"/></g></g>
<text x="22.0" y="928.0" class="e s43" textLength="319.2" lengthAdjust="spacingAndGlyphs">error GL0002: unknown command &#39;verson&#39;</text>
<text x="22.0" y="948.0" class="m s44" textLength="411.6" lengthAdjust="spacingAndGlyphs">  cause: &#39;verson&#39; is not a command of &#39;greenlens&#39;</text>
<text x="22.0" y="968.0" class="m s45" textLength="722.4" lengthAdjust="spacingAndGlyphs">  fix:   did you mean &#39;version&#39;? Run &#39;greenlens --help&#39; to list the available commands</text>
<g class="s47"><text x="22.0" y="1008.0" class="p">$</text><text x="38.8" y="1008.0" class="c" textLength="201.6" lengthAdjust="spacingAndGlyphs">greenlens version --nope</text><g class="t47"><rect x="38.8" y="994.0" width="218.4" height="20.0" fill="#0A1F17"/><rect class="cur" x="38.8" y="996.0" width="8.4" height="16.0" fill="#E8F7EF" fill-opacity=".8"/></g></g>
<text x="22.0" y="1028.0" class="e s48" textLength="294.0" lengthAdjust="spacingAndGlyphs">error GL0003: unknown flag &#39;--nope&#39;</text>
<text x="22.0" y="1048.0" class="m s49" textLength="520.8" lengthAdjust="spacingAndGlyphs">  cause: &#39;greenlens version&#39; does not accept the flag &#39;--nope&#39;</text>
<text x="22.0" y="1068.0" class="m s50" textLength="554.4" lengthAdjust="spacingAndGlyphs">  fix:   run &#39;greenlens version --help&#39; to list the accepted flags</text>
</g></g>
</svg>
