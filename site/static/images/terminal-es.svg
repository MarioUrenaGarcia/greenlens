<text x="442.0" y="22" text-anchor="middle" class="m">greenlens</text>
<clipPath id="screen"><rect x="0" y="48.0" width="884" height="368.0"/></clipPath>
<g clip-path="url(#screen)"><g class="scroll">
<g class="s0"><text x="22.0" y="68.0" class="p">$</text><text x="38.8" y="68.0" class="c" textLength="134.4" lengthAdjust="spacingAndGlyphs">greenlens --help</text><g class="t0"><rect x="38.8" y="54.0" width="151.2" height="20.0" fill="#0F1B2D"/><rect class="cur" x="38.8" y="56.0" width="8.4" height="16.0" fill="#E8F0FA" fill-opacity=".8"/></g></g>
<text x="22.0" y="88.0" class="o s1" textLength="655.2" lengthAdjust="spacingAndGlyphs">GreenLens mide, atribuye y reporta la energía, las emisiones y el costo de los</text>
<text x="22.0" y="108.0" class="o s2" textLength="378.0" lengthAdjust="spacingAndGlyphs">modelos de IA que se ejecutan en este equipo.</text>
<text x="22.0" y="148.0" class="o s4" textLength="33.6" lengthAdjust="spacingAndGlyphs">Uso:</text>
<text x="22.0" y="168.0" class="o s5" textLength="184.8" lengthAdjust="spacingAndGlyphs">  greenlens [opciones]</text>
<text x="22.0" y="188.0" class="o s6" textLength="176.4" lengthAdjust="spacingAndGlyphs">  greenlens [comando]</text>
<text x="22.0" y="228.0" class="o s8" textLength="176.4" lengthAdjust="spacingAndGlyphs">Comandos disponibles:</text>
<text x="22.0" y="248.0" class="o s9" textLength="369.6" lengthAdjust="spacingAndGlyphs">  help        Muestra la ayuda de un comando</text>
<text x="22.0" y="268.0" class="o s10" textLength="537.6" lengthAdjust="spacingAndGlyphs">  version     Muestra la versión y la información de compilación</text>
<text x="22.0" y="308.0" class="o s12" textLength="75.6" lengthAdjust="spacingAndGlyphs">Opciones:</text>
<text x="22.0" y="328.0" class="o s13" textLength="428.4" lengthAdjust="spacingAndGlyphs">  -h, --help          Muestra la ayuda de greenlens</text>
<text x="22.0" y="348.0" class="o s14" textLength="562.8" lengthAdjust="spacingAndGlyphs">      --lang idioma   Idioma de los mensajes (idioma: en o es). Por</text>
<text x="22.0" y="368.0" class="o s15" textLength="378.0" lengthAdjust="spacingAndGlyphs">                      defecto, el del sistema</text>
<text x="22.0" y="408.0" class="o s17" textLength="638.4" lengthAdjust="spacingAndGlyphs">Ejecuta &#39;greenlens [comando] --help&#39; para ver más información de un comando.</text>
<g class="s19"><text x="22.0" y="448.0" class="p">$</text><text x="38.8" y="448.0" class="c" textLength="134.4" lengthAdjust="spacingAndGlyphs">greenlens verson</text><g class="t19"><rect x="38.8" y="434.0" width="151.2" height="20.0" fill="#0F1B2D"/><rect class="cur" x="38.8" y="436.0" width="8.4" height="16.0" fill="#E8F0FA" fill-opacity=".8"/></g></g>
<text x="22.0" y="468.0" class="e s20" textLength="352.8" lengthAdjust="spacingAndGlyphs">error GL0002: comando desconocido &#39;verson&#39;</text>
<text x="22.0" y="488.0" class="m s21" textLength="436.8" lengthAdjust="spacingAndGlyphs">  causa:    &#39;verson&#39; no es un comando de &#39;greenlens&#39;</text>
<text x="22.0" y="508.0" class="m s22" textLength="831.6" lengthAdjust="spacingAndGlyphs">  solución: ¿quisiste decir &#39;version&#39;? Ejecuta &#39;greenlens --help&#39; para ver los comandos disponibles</text>
<g class="s24"><text x="22.0" y="548.0" class="p">$</text><text x="38.8" y="548.0" class="c" textLength="201.6" lengthAdjust="spacingAndGlyphs">greenlens version --nope</text><g class="t24"><rect x="38.8" y="534.0" width="218.4" height="20.0" fill="#0F1B2D"/><rect class="cur" x="38.8" y="536.0" width="8.4" height="16.0" fill="#E8F0FA" fill-opacity=".8"/></g></g>
<text x="22.0" y="568.0" class="e s25" textLength="344.4" lengthAdjust="spacingAndGlyphs">error GL0003: opción desconocida &#39;--nope&#39;</text>
<text x="22.0" y="588.0" class="m s26" textLength="504.0" lengthAdjust="spacingAndGlyphs">  causa:    &#39;greenlens version&#39; no acepta la opción &#39;--nope&#39;</text>
<text x="22.0" y="608.0" class="m s27" textLength="655.2" lengthAdjust="spacingAndGlyphs">  solución: ejecuta &#39;greenlens version --help&#39; para ver las opciones aceptadas</text>
</g></g>
</svg>
