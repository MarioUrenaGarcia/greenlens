<rect x=".5" y=".5" width="883" height="435" rx="12" fill="none" stroke="#DCFFEC" stroke-opacity=".16"/>
<rect width="884" height="34" rx="12" fill="#D6FFEA" fill-opacity=".07"/>
<circle cx="22" cy="17" r="6" fill="#EF5A5A" fill-opacity=".85"/>
