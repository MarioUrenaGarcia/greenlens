<text x="442.0" y="22" text-anchor="middle" class="m">greenlens</text>
<clipPath id="screen"><rect x="0" y="48.0" width="884" height="368.0"/></clipPath>
<g clip-path="url(#screen)"><g class="scroll">
<g class="s0"><text x="22.0" y="68.0" class="p">$</text><text x="38.8" y="68.0" class="c" textLength="134.4" lengthAdjust="spacingAndGlyphs">greenlens --help</text><g class="t0"><rect x="38.8" y="54.0" width="151.2" height="20.0" fill="#0A1F17"/><rect class="cur" x="38.8" y="56.0" width="8.4" height="16.0" fill="#E8F7EF" fill-opacity=".8"/></g></g>
<text x="22.0" y="88.0" class="o s1" textLength="655.2" lengthAdjust="spacingAndGlyphs">GreenLens mide, atribuye y reporta la energía, las emisiones y el costo de los</text>
<text x="22.0" y="108.0" class="o s2" textLength="378.0" lengthAdjust="spacingAndGlyphs">modelos de IA que se ejecutan en este equipo.</text>
<text x="22.0" y="148.0" class="o s4" textLength="33.6" lengthAdjust="spacingAndGlyphs">Uso:</text>
<text x="22.0" y="168.0" class="o s5" textLength="184.8" lengthAdjust="spacingAndGlyphs">  greenlens [opciones]</text>
<text x="22.0" y="188.0" class="o s6" textLength="176.4" lengthAdjust="spacingAndGlyphs">  greenlens [comando]</text>
<text x="22.0" y="228.0" class="o s8" textLength="176.4" lengthAdjust="spacingAndGlyphs">Comandos disponibles:</text>
<text x="22.0" y="248.0" class="o s9" textLength="411.6" lengthAdjust="spacingAndGlyphs">  agent             Ejecuta el agente de medición</text>
<text x="22.0" y="268.0" class="o s10" textLength="546.0" lengthAdjust="spacingAndGlyphs">  bench             Mide la energía de un modelo con un benchmark</text>
<text x="22.0" y="288.0" class="o s11" textLength="478.8" lengthAdjust="spacingAndGlyphs">  calibrate         Mide la potencia del equipo en reposo</text>
<text x="22.0" y="308.0" class="o s12" textLength="638.4" lengthAdjust="spacingAndGlyphs">  compare           Compara la energía por token de dos modelos o benchmarks</text>
<text x="22.0" y="328.0" class="o s13" textLength="445.2" lengthAdjust="spacingAndGlyphs">  config            Valida y muestra la configuración</text>
<text x="22.0" y="348.0" class="o s14" textLength="596.4" lengthAdjust="spacingAndGlyphs">  doctor            Diagnostica las fuentes de energía y la instalación</text>
<text x="22.0" y="368.0" class="o s15" textLength="420.0" lengthAdjust="spacingAndGlyphs">  help              Muestra la ayuda de un comando</text>
<text x="22.0" y="388.0" class="o s16" textLength="655.2" lengthAdjust="spacingAndGlyphs">  measure           Mide la energía de un comando, proceso o unidad de systemd</text>
<text x="22.0" y="408.0" class="o s17" textLength="546.0" lengthAdjust="spacingAndGlyphs">  proxy             Muestra el estado del proxy que cuenta tokens</text>
<text x="22.0" y="428.0" class="o s18" textLength="655.2" lengthAdjust="spacingAndGlyphs">  report            Reporta la energía, las emisiones y el costo de un periodo</text>
<text x="22.0" y="448.0" class="o s19" textLength="630.0" lengthAdjust="spacingAndGlyphs">  setup-permissions Permite al agente leer los sensores de energía sin root</text>
<text x="22.0" y="468.0" class="o s20" textLength="630.0" lengthAdjust="spacingAndGlyphs">  status            Muestra la potencia y el estado del agente en ejecución</text>
<text x="22.0" y="488.0" class="o s21" textLength="588.0" lengthAdjust="spacingAndGlyphs">  version           Muestra la versión y la información de compilación</text>
<text x="22.0" y="528.0" class="o s23" textLength="75.6" lengthAdjust="spacingAndGlyphs">Opciones:</text>
<text x="22.0" y="548.0" class="o s24" textLength="529.2" lengthAdjust="spacingAndGlyphs">      --config Archivo   Archivo de configuración. Por defecto,</text>
<text x="22.0" y="568.0" class="o s25" textLength="646.8" lengthAdjust="spacingAndGlyphs">                         /etc/greenlens/greenlens.yaml y luego el del usuario</text>
<text x="22.0" y="588.0" class="o s26" textLength="453.6" lengthAdjust="spacingAndGlyphs">  -h, --help             Muestra la ayuda de greenlens</text>
<text x="22.0" y="608.0" class="o s27" textLength="588.0" lengthAdjust="spacingAndGlyphs">      --lang idioma      Idioma de los mensajes (idioma: en o es). Por</text>
<text x="22.0" y="628.0" class="o s28" textLength="403.2" lengthAdjust="spacingAndGlyphs">                         defecto, el del sistema</text>
<text x="22.0" y="648.0" class="o s29" textLength="646.8" lengthAdjust="spacingAndGlyphs">      --no-color         No colorea la salida; NO_COLOR tiene el mismo efecto</text>
<text x="22.0" y="668.0" class="o s30" textLength="596.4" lengthAdjust="spacingAndGlyphs">  -o, --output formato   Formato de salida (formato: table, json, csv o</text>
<text x="22.0" y="688.0" class="o s31" textLength="403.2" lengthAdjust="spacingAndGlyphs">                         yaml) (default &#34;table&#34;)</text>
<text x="22.0" y="708.0" class="o s32" textLength="638.4" lengthAdjust="spacingAndGlyphs">  -q, --quiet            Muestra solo el resultado, sin progreso ni consejos</text>
<text x="22.0" y="728.0" class="o s33" textLength="596.4" lengthAdjust="spacingAndGlyphs">      --raw              Muestra los valores en unidades base (J, W, g)</text>
<text x="22.0" y="748.0" class="o s34" textLength="394.8" lengthAdjust="spacingAndGlyphs">                         con precisión completa</text>
<text x="22.0" y="768.0" class="o s35" textLength="596.4" lengthAdjust="spacingAndGlyphs">  -v, --verbose          Muestra detalles de cada paso, como errores al</text>
<text x="22.0" y="788.0" class="o s36" textLength="319.2" lengthAdjust="spacingAndGlyphs">                         leer sensores</text>
<text x="22.0" y="828.0" class="o s38" textLength="638.4" lengthAdjust="spacingAndGlyphs">Ejecuta &#39;greenlens [comando] --help&#39; para ver más información de un comando.</text>
<g class="s40"><text x="22.0" y="868.0" class="p">$</text><text x="38.8" y="868.0" class="c" textLength="134.4" lengthAdjust="spacingAndGlyphs">greenlens verson</text><g class="t40"><rect x="38.8" y="854.0" width="151.2" height="20.0" fill="#0A1F17"/><rect class="cur" x="38.8" y="856.0" width="8.4" height="16.0" fill="#E8F7EF" fill-opacity=".8"/></g></g>
<text x="22.0" y="888.0" class="e s41" textLength="352.8" lengthAdjust="spacingAndGlyphs">error GL0002: comando desconocido &#39;verson&#39;</text>
<text x="22.0" y="908.0" class="m s42" textLength="436.8" lengthAdjust="spacingAndGlyphs">  causa:    &#39;verson&#39; no es un comando de &#39;greenlens&#39;</text>
<text x="22.0" y="928.0" class="m s43" textLength="831.6" lengthAdjust="spacingAndGlyphs">  solución: ¿quisiste decir &#39;version&#39;? Ejecuta &#39;greenlens --help&#39; para ver los comandos disponibles</text>
<g class="s45"><text x="22.0" y="968.0" class="p">$</text><text x="38.8" y="968.0" class="c" textLength="201.6" lengthAdjust="spacingAndGlyphs">greenlens version --nope</text><g class="t45"><rect x="38.8" y="954.0" width="218.4" height="20.0" fill="#0A1F17"/><rect class="cur" x="38.8" y="956.0" width="8.4" height="16.0" fill="#E8F7EF" fill-opacity=".8"/></g></g>
<text x="22.0" y="988.0" class="e s46" textLength="344.4" lengthAdjust="spacingAndGlyphs">error GL0003: opción desconocida &#39;--nope&#39;</text>
<text x="22.0" y="1008.0" class="m s47" textLength="504.0" lengthAdjust="spacingAndGlyphs">  causa:    &#39;greenlens version&#39; no acepta la opción &#39;--nope&#39;</text>
<text x="22.0" y="1028.0" class="m s48" textLength="655.2" lengthAdjust="spacingAndGlyphs">  solución: ejecuta &#39;greenlens version --help&#39; para ver las opciones aceptadas</text>
</g></g>
</svg>
