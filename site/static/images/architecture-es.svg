<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t">
<title id="t">Arquitectura de GreenLens</title>
<style>
text{font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif;fill:#E8F0FA}
.h{font-size:15px;fill:#9DB2C9;letter-spacing:.3px}
.b{font-size:15px}.s{font-size:13px;fill:#9DB2C9}.big{font-size:20px;font-weight:600}
.flow{fill:none;stroke-width:2;stroke-dasharray:5 11;animation:flow 1.4s linear infinite}
.load{stroke:#F2A541}.eff{stroke:#35C9B0}.tok{stroke:#9DB2C9}
@keyframes flow{to{stroke-dashoffset:-32}}
.pulse{animation:pulse 6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
