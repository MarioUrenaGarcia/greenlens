[topic.measurement]
title = "How energy is measured"
body = "GreenLens reads the energy counters and power sensors the Linux kernel exposes and chooses, for every part of the machine, one source, so the same energy is never counted twice.\n\nThe parts are domains. CPU packages, memory and GPUs are components and add up to the energy of the node. CPU cores and uncore are part of their package. Platform and wall meters include the components and are never added to them; they show what the rest of the system uses.\n\nCounters report cumulative energy: GreenLens subtracts consecutive readings and corrects a counter that wraps. Power sensors report watts, integrated over time with the trapezoidal rule. Intervals are timed with the monotonic clock.\n\nEvery value carries its quality: measured, from a sensor of the component; platform, from a meter of the whole system; or estimated, from a model when nothing can be read."
see = "greenlens doctor, greenlens help sources, greenlens explain node_energy"

[topic.attribution]
title = "How energy is attributed"
body = "The hardware measures the node, not processes. Each sample, a workload gets the part of the processor and memory energy that matches its share of the CPU time, and the part of every GPU that matches its use of it as reported by NVML or by the DRM statistics of amdgpu, i915 and xe.\n\nattribution.idle_policy decides what happens to idle energy: dynamic attributes only the energy above the idle baseline measured by greenlens calibrate; proportional spreads idle energy too; full gives all the energy to the active workloads; wall starts from a platform or wall meter.\n\nEvery ten seconds the energy of an inference backend is split between its models by the tokens each processed. Every ten minutes the agent fits the energy of a prompt token and of a generated token for each model.\n\nThe sum of what is attributed never exceeds what was measured."
see = "greenlens measure, greenlens status, greenlens explain attributed_energy"

[topic.sources]
title = "Energy sources and how one is chosen"
body = "From the most to the least direct: powercap RAPL; the perf_event power counters; hwmon sensors of processors and of amdgpu, xe and i915 GPUs; NVML through greenlens-nvml, or nvidia-smi without it; ACPI power meters, IPMI DCMI and laptop batteries for the whole system; and, when nothing can be read, a model of the processor.\n\nFor every domain, and for every GPU by its PCI address, the source with the highest priority wins. RAPL and perf_event read the same counters, so only one is used. The sensor of an AMD processor with integrated graphics covers the whole processor and is used for the package only when RAPL cannot be read.\n\nsources.disable leaves sources out and sources.force prefers one for a domain. greenlens doctor shows every channel found, whether it is used and why not."
see = "greenlens doctor, greenlens help permissions, greenlens config show"

[topic.permissions]
title = "Reading the sensors without root"
body = "GreenLens never runs as root. Since the Platypus side channel, the kernel lets only root read the RAPL counters. sudo greenlens setup-permissions --apply gives them to the greenlens-power group with a udev rule; its members read them after their next login. --perfmon grants CAP_PERFMON for perf_event instead, and --ipmi opens the IPMI device to its group.\n\nThe sensors of AMD and Intel GPUs are readable by every user. NVIDIA GPUs are read by greenlens-nvml, installed next to greenlens; the system service needs the NVIDIA drop-in to open their devices.\n\nThe agent confines its own file access with Landlock: it reads /sys, /proc and its configuration, and writes only its data and socket directories. Every step of setup-permissions shows its plan before changing anything."
see = "greenlens setup-permissions, greenlens doctor"

[topic.privacy]
title = "What GreenLens keeps and what it does not"
body = "Every value is computed and stored on this machine, in the SQLite database of the agent. There is no telemetry and no outbound connection by default: GreenLens talks only to the inference servers of the node and to the endpoints you configure.\n\nPrompts and responses are never stored or logged. The optional proxy forwards requests unchanged and reads only the model and the token counts of the responses. Consumer keys are kept only as an HMAC with a salt local to the machine, or replaced by aliases you define from their SHA-256.\n\nBenchmarks keep the SHA-256 of their prompt set, never the prompts. The socket of the agent is open only to the members of its group, and every calibration and saved benchmark is written to the audit log with the user who sent it."
see = "greenlens proxy, greenlens help configuration"

[topic.configuration]
title = "Configuration"
body = "Values come, from the highest precedence to the lowest, from command line flags, GREENLENS_* environment variables, the configuration file and the defaults. The variable of a key is its path in upper case: GREENLENS_AGENT_SAMPLE_INTERVAL sets agent.sample_interval.\n\nThe system file is /etc/greenlens/greenlens.yaml; a user can keep one in $XDG_CONFIG_HOME/greenlens/greenlens.yaml; --config names another. Unknown keys are errors, so a typo never goes unnoticed.\n\ngreenlens config validate checks a file, config show prints the configuration in effect and config path where it comes from. The agent reloads the file on SIGHUP; the data directory, the socket and the host root change only after a restart."
see = "greenlens config validate, greenlens config show, greenlens doctor"

[explain.node_power]
title = "Power of the node"
what = "The power drawn by the components of the machine, its CPU packages, memory and GPUs, in the latest sample."
formula = "P = sum of the energy of the component domains in the sample / length of the sample"
unit = "watts (W)"
method = "measured from energy counters, integrated from power sensors, or estimated from the model of the processor; the quality of every domain says which"
limits = "It leaves out fans, disks, the network and the losses of the power supply; a platform or wall meter, when present, measures them."

[explain.node_energy]
title = "Energy of the node"
what = "The energy used by the components of the machine over a period, such as since the agent started or in a report."
formula = "E = sum over samples of the increase of every counter, corrected when it wraps, or of the power integrated with the trapezoidal rule"
unit = "joules (J), shown as Wh or kWh when large"
method = "measured, integrated or estimated, as the source of each domain"
limits = "Counters have their own resolution and update rate; samples read them every second by default."

[explain.idle_power]
title = "Idle power"
what = "The power of the machine at rest, which the dynamic policy subtracts so that only the energy of the work is attributed."
formula = "median (p50) of each domain over the calibration, 60 seconds by default; the agent keeps the 5th percentile of the last 24 hours to detect drift"
unit = "watts (W)"
method = "measured by greenlens calibrate"
limits = "It includes whatever ran during the calibration. The agent warns, after an hour of samples, when idle power moves more than 20% away from it."

[explain.dynamic_energy]
title = "Energy above idle"
what = "The energy used beyond the idle baseline, the part that work adds."
formula = "E_dynamic = max(0, E - P_idle x interval), in every sample"
unit = "joules (J)"
method = "derived from the measured energy and the calibration"
limits = "Without a calibration the baseline is zero and all the energy counts. A sample below idle counts as zero."

[explain.attributed_energy]
title = "Energy attributed to a workload"
what = "The part of the energy of the node that belongs to a backend, a model, a consumer or a process."
formula = "share = CPU time of the workload / busy CPU time; E = E_dynamic of package and memory x share + for every GPU, its energy above idle x the use of the workload"
unit = "joules (J)"
method = "attributed_cpu_share, attributed_gpu_process when the GPU reports use per process, token_weighted between models, estimated for equal parts"
limits = "CPU time does not capture memory bandwidth or cache use. The use of a GPU per process needs NVML, or DRM statistics the agent may read."

[explain.joules_per_token]
title = "Energy per generated token"
what = "The energy of a model divided by the tokens it generated; prompt processing is included in it."
formula = "J/token = energy attributed to the model / generated tokens"
unit = "joules per token (J/token)"
method = "from the attributed energy and the token counters of the backend or of the proxy"
limits = "It depends on the batch size, the prompt length and the concurrency of the period. greenlens bench measures it under fixed conditions."

[explain.tokens_per_second]
title = "Generated tokens per second"
what = "How fast a model generates tokens between two readings of the agent."
formula = "tokens/s = increase of the generated tokens / time between the readings"
unit = "tokens per second"
method = "from the token counters"
limits = "It covers only the refresh interval, so it moves with every request."

[explain.token_cost]
title = "Energy of a prompt token and of a generated token"
what = "How much energy processing one prompt token and generating one token cost, fitted from the usage of each model."
formula = "energy of an interval = a x prompt tokens + b x generated tokens + c, by least squares over the last 24 hours"
unit = "joules per token for a and b; watts for c over the length of an interval"
method = "regression, with 95% confidence intervals from Student's t"
limits = "Reported from 30 intervals on, when R2 reaches attribution.regression_min_r2 and no token costs negative energy. Intervals already split by tokens are left out."

[explain.co2e]
title = "Emissions"
what = "The greenhouse gas emissions of the energy used, from the electricity grid."
formula = "gCO2e = kWh x PUE x emission factor"
unit = "grams of CO2 equivalent (gCO2e)"
method = "computed; the default factor is the FESEN 2024 of Mexico, 444 gCO2e/kWh, published by SEMARNAT"
limits = "An average factor of the grid, not the marginal one of the hour; set indicators.emission_factor_g_per_kwh for another grid."

[explain.cost]
title = "Cost of electricity"
what = "What the energy used costs at the configured price."
formula = "cost = kWh x PUE x indicators.tariff.price_per_kwh"
unit = "the currency of indicators.tariff.currency"
method = "computed, only when a price is configured"
limits = "A flat price per kWh, without time blocks or demand charges."

[explain.water]
title = "Water"
what = "The water used by the facility to run the energy used, from its water usage effectiveness."
formula = "liters = kWh x indicators.wue_l_per_kwh"
unit = "liters (L)"
method = "computed, only when the factor is configured"
limits = "Only the water of the site, not that of electricity generation."

[explain.quality]
title = "Quality of a value"
what = "How directly a value was obtained, reported with every number."
formula = "measured: from a sensor of the component; platform: from a meter of the whole system; estimated: from a model"
unit = "none"
method = "set by the source of the energy; a value derived from several takes the least direct quality"
limits = "Measured values still carry the error of their sensor, which GreenLens does not correct."

[explain.method]
title = "Method of a value"
what = "How a value was computed, reported with every number."
formula = "measured, integrated, attributed_cpu_share, attributed_gpu_process, token_weighted, regression or estimated"
unit = "none"
method = "measured comes from a counter, integrated from a power sensor, the attributed ones split energy between workloads, token_weighted between models, regression fits token costs and estimated is a model or an equal split"
limits = "A value split several times carries the least direct method."

[cli.proxy]
short = "Show the state of the token-counting proxy"
long = "Show the address, upstream and requests of the reverse proxy the agent runs for servers that do not count tokens, such as Ollama. The proxy forwards requests unchanged and reads only token counts; enable it under proxy in the configuration."
disabled = "The proxy is off. Set proxy.enabled to true in the configuration and reload the agent to count the tokens of Ollama and other OpenAI-compatible servers."
listen = "Listening on"
upstream = "Forwarding to"
backend = "Backend"
requests = "Responses counted"
energy_header = "Energy header"
consumers = "Consumers by header"
yes = "yes"
no = "no"

[cli.report]
short = "Report the energy, emissions and cost of a period"
long = "Report the energy measured by the agent in a period, by domain and in total, with its emissions and, when a tariff is configured, its cost. With --group, report the energy attributed to each backend or model instead, with its tokens. Periods can be dates, RFC 3339 times or amounts of time ago such as 24h or 7d."
no_usage = "No energy was attributed to a backend in this period."
period = "From {from} to {to}"
total = "total"
factor = "Emission factor: {value} gCO2e/kWh ({source})."
estimated = "Part of the energy is estimated, not measured."
system_levels = "Platform and wall values include the components and are not added to them."

[cli.report.flag]
from = "Start of the period"
to = "End of the period"
by = "Group by none, hour or day"
group = "Report by backend, model or consumer instead of by domain"

[config.doc]
agent_sample_interval = "How often energy is sampled, from 50ms to 60s."
agent_data_dir = "Directory of the database. Empty: /var/lib/greenlens for the system service, $XDG_DATA_HOME/greenlens for a user."
agent_socket = "Unix socket of the agent. Empty: /run/greenlens/greenlens.sock for the system service, $XDG_RUNTIME_DIR/greenlens/greenlens.sock for a user."
agent_host_root = "Root of the host file system, such as /host in a container with the host root mounted there."
sources_auto = "Choose sources automatically. When false, only the sources named in sources.force are used."
sources_disable = "Sources that are never used."
sources_force = "Source preferred for a domain (package, dram, gpu, psys, platform), such as {package: perf_event}."
sources_rapl_min_interval = "Shortest sampling interval accepted; raising it lowers the time resolution of the RAPL counters."
sources_nvml_helper = "Path of greenlens-nvml, the helper that reads NVIDIA GPUs. Empty: next to greenlens, then /usr/libexec/greenlens and /usr/lib/greenlens."
sources_estimate_idle_watts = "Power of the whole CPU at 0% utilization for the estimate model; 0 uses the embedded table."
sources_estimate_full_watts = "Power of the whole CPU at 100% utilization for the estimate model; 0 uses the embedded table."
sources_estimate_exponent = "Exponent of the utilization in the estimate model; 1 is linear."
attribution_idle_policy = "How idle energy is attributed: dynamic, proportional, full or wall."
attribution_max_models_per_backend = "Most models tracked per backend; the energy of the others is reported together as 'other'."
attribution_max_consumers = "Most consumers tracked by the proxy; the others are reported together as 'other'."
proxy = "Token-counting reverse proxy run by the agent."
proxy_enabled = "Run the proxy."
proxy_listen = "Address and port the proxy listens on."
proxy_upstream = "Base URL of the server the proxy forwards to."
proxy_per_request_energy_header = "Add X-GreenLens-Energy-Joules to each response, as a trailer for streamed ones."
proxy_consumer_header = "Request header that tells consumers apart, such as Authorization; its value is kept only as an HMAC."
proxy_consumer_aliases_file = "YAML file mapping consumer names to the SHA-256 of header values, written as sha256:<hex>."
attribution_regression_min_r2 = "Lowest R2 at which the energy per prompt token and per generated token, fitted over the last 24 hours, is reported."
backends = "Inference servers declared in the configuration. They keep their name across restarts and take precedence over discovered ones."
backends_name = "Name of the backend in reports and metrics: lowercase letters, digits, '.', '_' or '-'."
backends_kind = "Engine of the backend, which selects how its tokens are read."
backends_endpoint = "Base URL of the server, such as http://127.0.0.1:8000."
backends_process = "File name of the executable, to find the processes of a process backend or of a server whose port is not visible."
discovery_enabled = "Look for known inference servers among the running processes."
discovery_interval = "How often processes and listening ports are scanned, from 1s to 10m."
indicators_emission_factor_g_per_kwh = "Grid emission factor in gCO2e/kWh. Null: FESEN 2024, 444 gCO2e/kWh."
indicators_emission_factor_source = "Where a configured emission factor comes from; required when the factor is set."
indicators_pue = "Power usage effectiveness of the facility; 1.0 means no overhead."
indicators_wue_l_per_kwh = "Water usage effectiveness in liters per kWh. Null: water is not reported."
indicators_tariff_price_per_kwh = "Price of electricity per kWh. Null: cost is not reported."
indicators_tariff_currency = "ISO 4217 code of the currency of the tariff."
retention_raw = "How long raw samples are kept."
retention_rollup_1m = "How long one-minute rollups are kept."
retention_rollup_1h = "How long one-hour rollups are kept."
logging_level = "Minimum level of the agent logs: debug, info, warn or error."
logging_format = "Format of the agent logs: json or text."

[errors]
label = "error"
cause = "cause:"
fix = "fix:"

[errors.GL0001]
message = "unexpected internal error"
cause = "{detail}"
fix = "report it at https://github.com/MarioUrenaGarcia/greenlens/issues with the output of 'greenlens version'"

[errors.GL0002]
message = "unknown command '{command}'"
cause = "'{command}' is not a command of '{parent}'"
fix = "run '{parent} --help' to list the available commands"
fix_suggest = "did you mean '{suggestion}'? Run '{parent} --help' to list the available commands"

[errors.GL0003]
message = "unknown flag '{flag}'"
cause = "'{command}' does not accept the flag '{flag}'"
fix = "run '{command} --help' to list the accepted flags"

[errors.GL0004]
message = "flag '{flag}' needs a value"
cause = "the flag was given without a value"
fix = "pass a value after the flag, for example '{flag} <value>'"

[errors.GL0005]
message = "invalid value '{value}' for flag '{flag}'"
cause = "the value does not have the type that '{flag}' expects"
fix = "run '{command} --help' to see the accepted values"

[errors.GL0006]
message = "invalid flag syntax '{arg}'"
cause = "a flag starts with '-' followed by one letter, or '--' followed by a name"
fix = "run '{command} --help' to see how to write each flag"

[errors.GL0007]
message = "'{command}' does not accept arguments"
cause = "received: {args}"
fix = "run '{command} --help' to see how to use it"

[errors.GL0008]
message = "unsupported language '{lang}'"
cause = "the language comes from {source}"
fix = "use one of: {supported}"

[errors.GL0015]
message = "'{command}' takes {want} arguments"
cause = "received {got}"
fix = "run '{command} --help' to see how to use it"

[errors.GL0016]
message = "greenlens top needs a terminal"
cause = "the standard output is not a terminal"
fix = "run it in a terminal, or use 'greenlens status' for a summary that can be piped"

[errors.GL0017]
message = "there is no explanation for '{metric}'"
cause = "the values that can be explained are: {metrics}"
fix = "run 'greenlens explain' to list them"

[errors.GL1001]
message = "no measured energy source is available"
cause = "this machine exposes no readable energy counter, as in most virtual machines"
fix = "run 'greenlens doctor' to see which sources were found and how to enable them"

[errors.GL1002]
message = "cannot read RAPL energy counters"
cause = "{path} is readable only by root"
fix = "run 'sudo greenlens setup-permissions' or see 'greenlens help GL1002'"

[errors.GL1003]
message = "cannot open the perf_event energy counters"
cause = "system-wide perf events need perf_event_paranoid 0 or less, or CAP_PERFMON (perf_event_paranoid is {paranoid})"
fix = "run 'sudo greenlens setup-permissions --perfmon', or rely on the powercap counters"

[errors.GL1004]
message = "cannot open the IPMI device"
cause = "{path} is not accessible to this user"
fix = "run 'sudo greenlens setup-permissions --ipmi'"

[errors.GL1005]
message = "cannot read a hwmon power sensor"
cause = "{path} is not readable by this user"
fix = "run 'sudo greenlens setup-permissions' or check the permissions of the sensor"

[errors.GL1006]
message = "the BMC does not report power readings"
cause = "the DCMI power reading command returned {detail}"
fix = "enable power monitoring in the BMC settings, or use another platform source"

[errors.GL1007]
message = "CPU energy is estimated"
cause = "no energy counter of the processor is readable on this machine"
fix = "on bare metal run 'sudo greenlens setup-permissions'; in a virtual machine set sources.estimate in the configuration"

[errors.GL1008]
message = "an energy counter can wrap more than once between samples"
cause = "{channel} wraps after {range}, which takes {period} at the highest power seen, and the sampling interval is {interval}"
fix = "set agent.sample_interval below {limit}"

[errors.GL1009]
message = "power sensor of an unknown hwmon driver is not used"
cause = "hwmon device '{name}' reports power or energy, but its domain is not known"
fix = "report the driver name at https://github.com/MarioUrenaGarcia/greenlens/issues so it can be classified"

[errors.GL1010]
message = "the processor is not in the estimation table"
cause = "'{model}' has no published power coefficients, so a generic average per thread is used"
fix = "set sources.estimate.idle_watts and sources.estimate.full_watts in the configuration with values for this processor"

[errors.GL3001]
message = "configuration file not found"
cause = "{path} does not exist"
fix = "check the path given with --config"

[errors.GL3002]
message = "cannot read the configuration file"
cause = "{path}: {detail}"
fix = "correct the file; 'greenlens config validate' lists every problem"

[errors.GL3003]
message = "invalid configuration value for {key}"
cause = "{detail}"
fix = "see the configuration reference, or run 'greenlens config show' for the values in effect"

[errors.GL3004]
message = "invalid value in the environment variable {name}"
cause = "{detail}"
fix = "correct or unset the variable"

[errors.GL4001]
message = "the agent is not running"
cause = "cannot connect to {socket}: {detail}"
fix = "start it with 'sudo systemctl start greenlens' or run 'greenlens agent' in another terminal"

[errors.GL4002]
message = "cannot open the database"
cause = "{path}: {detail}"
fix = "check that agent.data_dir exists and is writable by the user of the agent"

[errors.GL4003]
message = "cannot create the agent socket"
cause = "{path}: {detail}"
fix = "check agent.socket and the permissions of its directory"

[errors.GL4004]
message = "there is no directory for the agent socket"
cause = "XDG_RUNTIME_DIR is not set and agent.socket is empty"
fix = "set agent.socket in the configuration"

[errors.GL4005]
message = "another agent is already running"
cause = "{path} accepts connections"
fix = "stop the other agent, or give this one a different agent.socket and agent.data_dir"

[errors.GL4006]
message = "the agent rejected the request"
cause = "{status}: {detail}"
fix = "check the agent logs, for example with 'journalctl -u greenlens'"

[errors.GL0009]
message = "unsupported output format '{value}'"
cause = "the output can be written only as {formats}"
fix = "pass one of these to --output"

[errors.GL0010]
message = "unknown error code '{code}'"
cause = "{code} is not an error code of GreenLens"
fix = "see the error code reference in the documentation"

[errors.GL0011]
message = "cannot start '{command}'"
cause = "{detail}"
fix = "check the name of the command and that it is in PATH"

[errors.GL0012]
message = "measure needs exactly one target"
cause = "give a command after --, or --pid, or --unit, but only one of them"
fix = "run 'greenlens measure --help' for examples"

[errors.GL0013]
message = "process {pid} does not exist"
cause = "no process has that PID, or it is not visible from here"
fix = "check the PID with ps, or measure a command instead"

[errors.GL0014]
message = "cannot find the cgroup of {unit}"
cause = "no cgroup v2 directory named {unit} exists under /sys/fs/cgroup"
fix = "check the name with 'systemctl status', and that the unit is running"

[errors.GL1011]
message = "changing permissions needs root"
cause = "the command runs as {user}"
fix = "run 'sudo greenlens setup-permissions --apply'"

[errors.GL1012]
message = "step {step} of the plan failed"
cause = "{detail}"
fix = "fix the problem and run the command again; completed steps can be repeated safely"

[errors.GL1013]
message = "an NVIDIA GPU is present but greenlens-nvml is not installed"
cause = "the helper that reads NVML was not found in {dirs}"
fix = "install greenlens-nvml from the same release next to greenlens, or set sources.nvml.helper; until then nvidia-smi is used if present"

[errors.GL1014]
message = "the NVIDIA Management Library cannot be used"
cause = "{detail}"
fix = "check that the NVIDIA driver is loaded and that 'nvidia-smi' works for the user of the agent"

[errors.GL1015]
message = "nvidia-smi cannot read the NVIDIA GPUs"
cause = "{detail}"
fix = "check that the NVIDIA driver is loaded and that 'nvidia-smi' works for the user of the agent"

[errors.GL2001]
message = "cannot read the backend {name}"
cause = "{endpoint} did not answer: {detail}"
fix = "check that the server runs and listens there; for a declared backend, check its endpoint in the configuration"

[errors.GL2002]
message = "the backend {name} does not expose metrics"
cause = "{kind} serves token counters only when started with {flag}"
fix = "restart it with {flag}; until then its energy is measured but not split by model or token"

[errors.GL2003]
message = "the backend refused the benchmark"
cause = "{endpoint} answered {detail}"
fix = "check that the model {model} is available in the backend, for Ollama with 'ollama list', and that --kind matches the server"
