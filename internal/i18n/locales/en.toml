[cli.agent]
short = "Run the measuring agent"
long = "Run the agent in the foreground: it samples the energy sources, stores the measurements and serves the other commands through its local socket. Under systemd it runs as the greenlens service. SIGHUP reloads the configuration and SIGTERM stops it."

[cli.status]
short = "Show the power and state of the running agent"
long = "Show the power of every domain in the latest sample, the energy since the agent started, the quality of each value, the idle baseline and the consumption of the agent itself."
agent = "Agent"
uptime = "running for"
samples = "samples:"
interval = "Sampling every"
policy = "idle policy"
baseline = "Idle baseline of the CPU:"
drift = "The idle power is now {idle}, {percent}% away from the calibration; run 'greenlens calibrate' again."
no_calibration = "No calibration: run 'greenlens calibrate' with the machine idle so dynamic energy can be separated from idle energy."
self = "Energy of the agent itself:"
memory = "memory"

[cli.brief]
no_agent = "The GreenLens agent is not running."
next_agent = "Next: run 'greenlens doctor' to check the energy sources, then start the agent with 'greenlens agent'."
