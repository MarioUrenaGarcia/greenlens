[cli.calibrate]
short = "Mide la potencia del equipo en reposo"
long = "Mide la potencia de cada dominio mientras el equipo está en reposo y guarda la mediana como línea base de reposo. La política de reposo dynamic resta esta línea base antes de atribuir energía a los procesos. Detén otras cargas antes."
