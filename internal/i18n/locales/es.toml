group_relogin = "miembro, activo desde el próximo inicio de sesión"
group_missing = "no es miembro"
landlock = "Landlock"
landlock_on = "disponible, ABI {abi}"
landlock_off = "no disponible"
config = "Configuración"
agent = "Agente"
agent_on = "en ejecución en {socket}"
agent_off = "no está en ejecución"
selected = "se usa"
discarded = "no se usa"
measured = "La energía de la CPU se mide con contadores de hardware."
estimated = "La energía de la CPU se estima con el modelo: {model}."

[cli.perm]
short = "Permite al agente leer los sensores de energía sin root"
long = "Muestra los cambios que dan al grupo greenlens-power acceso de lectura a los contadores de energía RAPL y, de forma opcional, al dispositivo IPMI y la capacidad CAP_PERFMON para perf_event. Nada cambia hasta que el comando se ejecuta como root con --apply."
plan = "Plan:"
