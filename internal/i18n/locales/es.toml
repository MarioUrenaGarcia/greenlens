next_status = "Siguiente paso: 'greenlens status' para ver detalles, o 'greenlens report' para la energía de un periodo."
more = "Ejecuta 'greenlens --help' para ver todos los comandos."

[cli.config]
short = "Valida y muestra la configuración"
