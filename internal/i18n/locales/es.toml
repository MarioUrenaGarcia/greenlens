# Mensajes en español. Cada clave debe existir también en en.toml con los
# mismos {marcadores}. Los valores son cadenas básicas de una sola línea.

[cli.root]
short = "Observabilidad energética para inferencia de IA local"
long = "GreenLens mide, atribuye y reporta la energía, las emisiones y el costo de los modelos de IA que se ejecutan en este equipo."

[cli.flag]
help = "Muestra la ayuda de {command}"
lang = "Idioma de los mensajes (`idioma`: en o es). Por defecto, el del sistema"
output = "Formato de salida (`formato`: table, json, csv o yaml)"
quiet = "Muestra solo el resultado, sin progreso ni consejos"
verbose = "Muestra detalles de cada paso, como errores al leer sensores"
config = "`Archivo` de configuración. Por defecto, /etc/greenlens/greenlens.yaml y luego el del usuario"
no_color = "No colorea la salida; NO_COLOR tiene el mismo efecto"
raw = "Muestra los valores en unidades base (J, W, g) con precisión completa"
interval = "Intervalo de muestreo (por defecto, agent.sample_interval)"

[cli.help_cmd]
short = "Muestra la ayuda de un comando"
long = "Muestra la ayuda de un comando. Sin argumentos, muestra la ayuda de greenlens."

