[errors]
label = "error"
cause = "causa:"
fix = "solución:"

[errors.GL0001]
message = "error interno inesperado"
cause = "{detail}"
fix = "repórtalo en https://github.com/MarioUrenaGarcia/greenlens/issues con la salida de 'greenlens version'"

[errors.GL0002]
message = "comando desconocido '{command}'"
cause = "'{command}' no es un comando de '{parent}'"
fix = "ejecuta '{parent} --help' para ver los comandos disponibles"
fix_suggest = "¿quisiste decir '{suggestion}'? Ejecuta '{parent} --help' para ver los comandos disponibles"

[errors.GL0003]
message = "opción desconocida '{flag}'"
cause = "'{command}' no acepta la opción '{flag}'"
fix = "ejecuta '{command} --help' para ver las opciones aceptadas"

[errors.GL0004]
message = "la opción '{flag}' necesita un valor"
cause = "la opción se indicó sin valor"
fix = "indica un valor después de la opción, por ejemplo '{flag} <valor>'"

[errors.GL0005]
message = "valor '{value}' no válido para la opción '{flag}'"
cause = "el valor no tiene el tipo que espera '{flag}'"
fix = "ejecuta '{command} --help' para ver los valores aceptados"

[errors.GL0006]
message = "sintaxis de opción no válida '{arg}'"
cause = "una opción empieza con '-' seguido de una letra, o con '--' seguido de un nombre"
fix = "ejecuta '{command} --help' para ver cómo se escribe cada opción"

[errors.GL0007]
message = "'{command}' no acepta argumentos"
cause = "se recibió: {args}"
fix = "ejecuta '{command} --help' para ver cómo usarlo"

[errors.GL0008]
message = "idioma no soportado '{lang}'"
cause = "el idioma proviene de {source}"
fix = "usa uno de: {supported}"

[errors.GL0015]
message = "'{command}' recibe {want} argumentos"
cause = "se recibieron {got}"
fix = "ejecuta '{command} --help' para ver cómo usarlo"

[errors.GL0016]
message = "greenlens top necesita una terminal"
cause = "la salida estándar no es una terminal"
fix = "ejecútalo en una terminal, o usa 'greenlens status' para un resumen que se puede redirigir"

[errors.GL0017]
message = "no hay explicación para '{metric}'"
cause = "los valores que se pueden explicar son: {metrics}"
fix = "ejecuta 'greenlens explain' para listarlos"

[errors.GL0018]
message = "no hay ningún token de acceso '{token}'"
cause = "ningún token tiene este id o nombre"
fix = "ejecuta 'greenlens token list' para ver los tokens"

[errors.GL1001]
message = "no hay ninguna fuente de energía medida disponible"
cause = "este equipo no expone ningún contador de energía legible, como ocurre en la mayoría de las máquinas virtuales"
fix = "ejecuta 'greenlens doctor' para ver qué fuentes se encontraron y cómo habilitarlas"

[errors.GL1002]
message = "no se pueden leer los contadores de energía RAPL"
cause = "{path} solo puede leerlo root"
fix = "ejecuta 'sudo greenlens setup-permissions' o consulta 'greenlens help GL1002'"

[errors.GL1003]
message = "no se pueden abrir los contadores de energía de perf_event"
cause = "los eventos perf de todo el sistema requieren perf_event_paranoid 0 o menor, o CAP_PERFMON (perf_event_paranoid vale {paranoid})"
fix = "ejecuta 'sudo greenlens setup-permissions --perfmon', o usa los contadores de powercap"

[errors.GL1004]
message = "no se puede abrir el dispositivo IPMI"
cause = "{path} no es accesible para este usuario"
fix = "ejecuta 'sudo greenlens setup-permissions --ipmi'"

[errors.GL1005]
message = "no se puede leer un sensor de potencia de hwmon"
cause = "{path} no es legible para este usuario"
fix = "ejecuta 'sudo greenlens setup-permissions' o revisa los permisos del sensor"

[errors.GL1006]
message = "el BMC no reporta lecturas de potencia"
cause = "el comando DCMI de lectura de potencia respondió {detail}"
fix = "activa la medición de potencia en la configuración del BMC, o usa otra fuente de plataforma"

[errors.GL1007]
message = "la energía de la CPU es estimada"
cause = "ningún contador de energía del procesador es legible en este equipo"
fix = "en hardware físico ejecuta 'sudo greenlens setup-permissions'; en una máquina virtual define sources.estimate en la configuración"

[errors.GL1008]
message = "un contador de energía puede desbordarse más de una vez entre muestras"
cause = "{channel} se desborda al llegar a {range}, lo que tarda {period} con la potencia más alta observada, y el intervalo de muestreo es {interval}"
fix = "define agent.sample_interval por debajo de {limit}"

[errors.GL1009]
message = "no se usa el sensor de potencia de un driver de hwmon desconocido"
cause = "el dispositivo hwmon '{name}' reporta potencia o energía, pero no se conoce su dominio"
fix = "reporta el nombre del driver en https://github.com/MarioUrenaGarcia/greenlens/issues para clasificarlo"

[errors.GL1010]
message = "el procesador no está en la tabla de estimación"
cause = "'{model}' no tiene coeficientes de potencia publicados, así que se usa un promedio genérico por hilo"
fix = "define sources.estimate.idle_watts y sources.estimate.full_watts en la configuración con valores para este procesador"

[errors.GL3001]
message = "no se encontró el archivo de configuración"
cause = "{path} no existe"
fix = "revisa la ruta indicada con --config"

[errors.GL3002]
message = "no se puede leer el archivo de configuración"
cause = "{path}: {detail}"
fix = "corrige el archivo; 'greenlens config validate' lista todos los problemas"

[errors.GL3003]
message = "valor de configuración no válido para {key}"
cause = "{detail}"
fix = "consulta la referencia de configuración, o ejecuta 'greenlens config show' para ver los valores en uso"

[errors.GL3004]
message = "valor no válido en la variable de entorno {name}"
cause = "{detail}"
fix = "corrige la variable o elimínala"

[errors.GL4001]
message = "el agente no está en ejecución"
cause = "no se puede conectar a {socket}: {detail}"
fix = "inícialo con 'sudo systemctl start greenlens' o ejecuta 'greenlens agent' en otra terminal"

[errors.GL4002]
message = "no se puede abrir la base de datos"
cause = "{path}: {detail}"
fix = "revisa que agent.data_dir exista y que el usuario del agente pueda escribir en él"

[errors.GL4003]
message = "no se puede crear el socket del agente"
cause = "{path}: {detail}"
fix = "revisa agent.socket y los permisos de su directorio"

[errors.GL4004]
message = "no hay directorio para el socket del agente"
cause = "XDG_RUNTIME_DIR no está definido y agent.socket está vacío"
fix = "define agent.socket en la configuración"

[errors.GL4005]
message = "ya hay otro agente en ejecución"
cause = "{path} acepta conexiones"
fix = "detén el otro agente, o asigna a este otro agent.socket y otro agent.data_dir"

[errors.GL4006]
message = "el agente rechazó la solicitud"
cause = "{status}: {detail}"
fix = "revisa los registros del agente, por ejemplo con 'journalctl -u greenlens'"

[errors.GL4007]
message = "no se puede escribir el respaldo"
cause = "{path}: {detail}"
fix = "elige un archivo nuevo en un directorio donde puedas escribir; un respaldo nunca reemplaza un archivo existente"

[errors.GL4008]
message = "el archivo no es un respaldo válido de GreenLens"
cause = "{path}: {detail}"
fix = "comprueba que el archivo lo creó 'greenlens backup' y que se copió completo; no se cambió nada"

[errors.GL4009]
message = "no se puede restaurar mientras el agente está en ejecución"
cause = "el agente responde en {socket}"
fix = "detenlo primero, por ejemplo con 'sudo systemctl stop greenlens', restaura y vuelve a iniciarlo"

[errors.GL4010]
message = "el respaldo lo creó una versión más reciente de GreenLens"
cause = "{path} tiene la versión de esquema {version}; esta versión lee hasta la {supported}"
fix = "actualiza GreenLens y vuelve a restaurar el respaldo; no se cambió nada"

[errors.GL4011]
message = "la API HTTP quedaría abierta a la red sin autenticación"
cause = "server.listen es {listen} y no hay ningún token de acceso"
fix = "crea uno primero con 'greenlens token create --name admin --role admin', o deja server.listen en 127.0.0.1"

[errors.GL4012]
message = "la API HTTP no puede escuchar en {listen}"
cause = "{detail}"
fix = "elige otro server.listen, detén el programa que usa el puerto o pon server.enabled en false"

[errors.GL4013]
message = "no se puede usar el archivo de tokens"
cause = "{path}: {detail}"
fix = "restáuralo de un respaldo, o bórralo y vuelve a crear los tokens; solo el agente debe poder leerlo (chmod 600)"

[errors.GL4014]
message = "no se puede cargar el certificado TLS"
cause = "{detail}"
fix = "revisa server.tls.cert_file y server.tls.key_file: ambos deben ser archivos PEM del mismo par de llaves"

[errors.GL0009]
message = "formato de salida no soportado '{value}'"
cause = "la salida solo se puede escribir como {formats}"
fix = "indica uno de ellos en --output"

[errors.GL0010]
message = "código de error desconocido '{code}'"
cause = "{code} no es un código de error de GreenLens"
fix = "consulta la referencia de códigos de error en la documentación"

[errors.GL0011]
message = "no se puede iniciar '{command}'"
cause = "{detail}"
fix = "revisa el nombre del comando y que esté en el PATH"

[errors.GL0012]
message = "measure necesita exactamente un objetivo"
cause = "indica un comando después de --, o --pid, o --unit, pero solo uno de ellos"
fix = "ejecuta 'greenlens measure --help' para ver ejemplos"

[errors.GL0013]
message = "el proceso {pid} no existe"
cause = "ningún proceso tiene ese PID, o no es visible desde aquí"
fix = "revisa el PID con ps, o mide un comando en su lugar"

[errors.GL0014]
message = "no se encuentra el cgroup de {unit}"
cause = "no existe un directorio de cgroup v2 llamado {unit} bajo /sys/fs/cgroup"
fix = "revisa el nombre con 'systemctl status' y que la unidad esté en ejecución"

[errors.GL1011]
message = "cambiar permisos requiere root"
cause = "el comando se ejecuta como {user}"
fix = "ejecuta 'sudo greenlens setup-permissions --apply'"

[errors.GL1012]
message = "falló el paso {step} del plan"
cause = "{detail}"
fix = "corrige el problema y ejecuta el comando de nuevo; los pasos ya completados se pueden repetir sin riesgo"

[errors.GL1013]
message = "hay una GPU NVIDIA pero greenlens-nvml no está instalado"
cause = "el auxiliar que lee NVML no se encontró en {dirs}"
fix = "instala greenlens-nvml de la misma versión junto a greenlens, o define sources.nvml.helper; mientras tanto se usa nvidia-smi si está presente"

[errors.GL1014]
message = "no se puede usar la biblioteca de gestión de NVIDIA (NVML)"
cause = "{detail}"
fix = "verifica que el driver de NVIDIA esté cargado y que 'nvidia-smi' funcione para el usuario del agente"

[errors.GL1015]
message = "nvidia-smi no puede leer las GPU NVIDIA"
cause = "{detail}"
fix = "verifica que el driver de NVIDIA esté cargado y que 'nvidia-smi' funcione para el usuario del agente"

[errors.GL2001]
message = "no se puede leer el backend {name}"
cause = "{endpoint} no respondió: {detail}"
fix = "verifica que el servidor esté en ejecución y escuche ahí; si es un backend declarado, revisa su endpoint en la configuración"

[errors.GL2002]
message = "el backend {name} no expone métricas"
cause = "{kind} solo ofrece contadores de tokens cuando se inicia con {flag}"
fix = "reinícialo con {flag}; mientras tanto su energía se mide pero no se reparte por modelo ni por token"

[errors.GL2003]
message = "el backend rechazó el benchmark"
cause = "{endpoint} respondió {detail}"
fix = "verifica que el modelo {model} esté disponible en el backend, en Ollama con 'ollama list', y que --kind corresponda al servidor"

