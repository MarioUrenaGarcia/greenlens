frequency = "Frecuencia de CPU:"
governor = "governor:"
temperature = "temperatura:"
saved = "Guardado en {where}."

[cli.calibrate.flag]
duration = "Cuánto tiempo medir"

[cli.measure]
short = "Mide la energía de un comando, proceso o unidad de systemd"
long = "Mide la energía usada mientras corre un comando, mientras corren un proceso y sus hijos, o mientras corre una unidad de systemd, y le atribuye la parte de la energía de CPU y memoria que corresponde a su tiempo de CPU. Con un comando, su código de salida pasa a ser el de measure y el reporte va a la salida de error."
no_baseline = "No se encontró calibración: toda la energía por encima de cero cuenta como dinámica. Ejecuta 'greenlens calibrate' para un mejor reparto."
target = "Medido"
duration = "Duración"
energy = "Energía atribuida"
cpu = "  CPU"
dram = "  memoria"
power = "Potencia promedio"
share = "Proporción de CPU"
node = "Energía del nodo"
co2e = "Emisiones"
cost = "Costo"
water = "Agua"
method = "Método"
policy = "política de reposo"
baseline = "Línea base de reposo"
platform = "Energía de plataforma atribuida"

[cli.measure.flag]
