[cli.export.benchmarks]
short = "Exporta los benchmarks guardados"
long = "Exporta los benchmarks guardados, del más reciente al más antiguo, con su energía por token generado, desviación estándar, coeficiente de variación e intervalo de confianza al 95%. La salida JSON conserva cada corrida."

