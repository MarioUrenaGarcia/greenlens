[cli.status]
short = "Muestra la potencia y el estado del agente en ejecución"
long = "Muestra la potencia de cada dominio en la última muestra, la energía desde que inició el agente, la calidad de cada valor, la línea base de reposo y el consumo del propio agente."
agent = "Agente"
uptime = "en ejecución desde hace"
samples = "muestras:"
