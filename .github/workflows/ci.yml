name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the whole history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install tools
        run: make tools
      # The end-to-end tests of the interface use the Chrome of the runner
      # and fail instead of being skipped when it is missing.
      - name: Find the browser
        run: |
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome" || { echo "no Chromium or Chrome on the runner"; exit 1; }
          echo "GREENLENS_CHROME=$chrome" >> "$GITHUB_ENV"
      - name: Check
        run: make check
      - name: Build
        run: make build
