      required: [schema_version, benchmarks]
      properties:
        schema_version: {type: integer, description: Version of the document., x-description-es: Versión del documento.}
        benchmarks:
          type: array
          description: The benchmarks.
          x-description-es: Los benchmarks.
          items: {$ref: "#/components/schemas/Benchmark"}

    Token:
      type: object
      description: An access token without its secret.
      x-description-es: Un token de acceso sin su secreto.
      additionalProperties: false
      required: [id, name, role, created_at]
      properties:
        id: {type: string, pattern: "^[0-9a-f]{12}$", description: Identifier., x-description-es: Identificador.}
        name: {type: string, description: Name., x-description-es: Nombre.}
        role: {$ref: "#/components/schemas/Role"}
        created_at: {type: string, format: date-time, description: Creation time., x-description-es: Fecha de creación.}
        expires_at: {type: string, format: date-time, description: Expiry; absent when it never expires., x-description-es: Caducidad; ausente si nunca caduca.}

    Role:
      type: string
      enum: [viewer, operator, admin]
      description: viewer reads; operator also runs benchmarks and calibrations; admin also manages tokens and backups.
      x-description-es: viewer lee; operator además ejecuta benchmarks y calibraciones; admin además gestiona tokens y respaldos.

    Tokens:
      type: object
      description: The access tokens.
      x-description-es: Los tokens de acceso.
      additionalProperties: false
      required: [schema_version, tokens]
      properties:
        schema_version: {type: integer, description: Version of the document., x-description-es: Versión del documento.}
        tokens:
          type: array
          description: The tokens, oldest first.
          x-description-es: Los tokens, del más antiguo al más reciente.
          items: {$ref: "#/components/schemas/Token"}

    CreateToken:
      type: object
      description: A token to create.
      x-description-es: Un token a crear.
      additionalProperties: false
      required: [name, role]
      properties:
        name: {type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,62}$", description: Name., x-description-es: Nombre.}
        role: {$ref: "#/components/schemas/Role"}
        expires_in_s: {type: integer, minimum: 0, description: Lifetime in seconds; zero never expires., x-description-es: Vigencia en segundos; cero nunca caduca.}

    CreatedToken:
      type: object
      description: A new token with its secret.
      x-description-es: Un token nuevo con su secreto.
      additionalProperties: false
      required: [schema_version, token, secret]
      properties:
        schema_version: {type: integer, description: Version of the document., x-description-es: Versión del documento.}
        token: {$ref: "#/components/schemas/Token"}
        secret: {type: string, description: The secret, shown only in this answer., x-description-es: El secreto, que solo se muestra en esta respuesta.}

    Login:
      type: object
      description: Sign-in with an access token.
      x-description-es: Inicio de sesión con un token de acceso.
      additionalProperties: false
      required: [token]
      properties:
        token: {type: string, description: The secret of the token., x-description-es: El secreto del token.}

    Session:
      type: object
      description: Who sends a request.
      x-description-es: Quién envía una solicitud.
      additionalProperties: false
      required: [schema_version, role, actor, via]
      properties:
        schema_version: {type: integer, description: Version of the document., x-description-es: Versión del documento.}
        role: {$ref: "#/components/schemas/Role"}
        actor: {type: string, description: Name in the audit log, such as uid:1000 or token:grafana., x-description-es: Nombre en el registro de auditoría, como uid:1000 o token:grafana.}
        via: {type: string, enum: [socket, session, token], description: How the principal was recognized., x-description-es: Cómo se reconoció al principal.}
        csrf: {type: string, description: Token to send in X-GreenLens-CSRF, for browser sessions., x-description-es: Token para enviar en X-GreenLens-CSRF, en sesiones del navegador.}

    SessionCodeRequest:
      type: object
      description: Request of a sign-in link.
      x-description-es: Solicitud de un enlace de inicio de sesión.
      additionalProperties: false
      properties:
        role: {$ref: "#/components/schemas/Role"}

    SessionCode:
      type: object
      description: A one-time sign-in link.
      x-description-es: Un enlace de inicio de sesión de un solo uso.
      additionalProperties: false
      required: [schema_version, url, expires_at]
      properties:
        schema_version: {type: integer, description: Version of the document., x-description-es: Versión del documento.}
        url: {type: string, description: Link to open in a browser of this machine., x-description-es: Enlace para abrir en un navegador de esta máquina.}
        expires_at: {type: string, format: date-time, description: When the link stops working., x-description-es: Cuándo deja de funcionar el enlace.}

    AuditEntry:
      type: object
      description: One action of an operator or administrator.
      x-description-es: Una acción de un operador o administrador.
      additionalProperties: false
      required: [id, time, actor, action, detail]
      properties:
        id: {type: integer, description: Identifier., x-description-es: Identificador.}
        time: {type: string, format: date-time, description: When it happened., x-description-es: Cuándo ocurrió.}
        actor: {type: string, description: Who did it., x-description-es: Quién la hizo.}
        action: {type: string, description: What was done, such as token_create or benchmark., x-description-es: Qué se hizo, como token_create o benchmark.}
        detail: {type: string, description: Details; never a secret., x-description-es: Detalles; nunca un secreto.}

    Audit:
      type: object
      description: The audit log.
      x-description-es: El registro de auditoría.
      additionalProperties: false
      required: [schema_version, entries]
      properties:
        schema_version: {type: integer, description: Version of the document., x-description-es: Versión del documento.}
        entries:
          type: array
          description: Entries, newest first.
          x-description-es: Entradas, de la más reciente a la más antigua.
          items: {$ref: "#/components/schemas/AuditEntry"}
