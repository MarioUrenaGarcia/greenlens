#
# The HTTP API of the GreenLens agent. This file is the source of truth: the
# tests check that every route of the agent is described here with its role,
# and that the documents the agent returns match these schemas. Every
# description has its Spanish translation in x-description-es, used by the
# generated reference.
openapi: 3.1.0
info:
  title: GreenLens agent API
  version: "1"
  description: >-
    Energy measurements of the node, its inference backends and models, served
    by the agent on its Unix socket and on 127.0.0.1:10060. Every document
    carries schema_version, which changes only when a field changes meaning or
    disappears. On the HTTP listener, any request can also be answered with
    429 when its address sends too many, and with 413 when its body exceeds
    1 MiB.
  x-description-es: >-
    Mediciones de energía del nodo, sus backends de inferencia y modelos, que
    el agente atiende en su socket Unix y en 127.0.0.1:10060. Cada documento
    lleva schema_version, que cambia solo cuando un campo cambia de
    significado o desaparece. En el listener HTTP, cualquier solicitud puede
    recibir además 429 cuando su dirección envía demasiadas, y 413 cuando su
    cuerpo pasa de 1 MiB.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: http://127.0.0.1:10060
security:
  - bearer: []
  - session: []
tags:
  - name: health
  - name: measurements
  - name: benchmarks
  - name: access
  - name: administration

paths:
  /healthz:
    get:
      operationId: health
      tags: [health]
      summary: Check that the agent answers
      x-summary-es: Comprueba que el agente responde
      x-greenlens-role: public
      security: []
      responses:
        "200":
          description: The agent is running.
          x-description-es: El agente está en ejecución.
          content:
            text/plain:
              schema: {type: string}
  /readyz:
    get:
      operationId: ready
      tags: [health]
      summary: Check that the agent has taken a sample
      x-summary-es: Comprueba que el agente ya tomó una muestra
      x-greenlens-role: public
      security: []
      responses:
        "200":
          description: At least one sample was taken.
          x-description-es: Se tomó al menos una muestra.
          content:
            text/plain:
              schema: {type: string}
        "503":
          description: No sample yet.
          x-description-es: Todavía no hay muestras.
  /metrics:
    get:
      operationId: metrics
      tags: [measurements]
      summary: Prometheus metrics
      x-summary-es: Métricas de Prometheus
      description: >-
        The metrics in the Prometheus text exposition format 0.0.4. Public unless
        server.metrics_auth is set.
      x-description-es: >-
        Las métricas en el formato de texto de Prometheus 0.0.4. Públicas salvo
        que se active server.metrics_auth.
      x-greenlens-role: public
      security: []
      responses:
        "200":
          description: The metrics.
          x-description-es: Las métricas.
          content:
            text/plain:
              schema: {type: string}
  /api/v1/about:
    get:
      operationId: about
      tags: [health]
      summary: Version, license and source code of the running agent
      x-summary-es: Versión, licencia y código fuente del agente en ejecución
      x-greenlens-role: viewer
      responses:
        "200":
          description: The description of the running version.
          x-description-es: La descripción de la versión en ejecución.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/About"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/catalogs/{lang}:
    get:
      operationId: catalog
      tags: [health]
      summary: Messages of one language for the graphical interface
      x-summary-es: Mensajes de un idioma para la interfaz gráfica
      x-greenlens-role: public
      security: []
      parameters:
        - name: lang
          in: path
          required: true
          description: Language, such as en or es.
          x-description-es: Idioma, como en o es.
          schema: {type: string}
      responses:
        "200":
          description: The messages.
          x-description-es: Los mensajes.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Catalog"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/openapi.yaml:
    get:
      operationId: openapi
      tags: [health]
      summary: This description of the API
      x-summary-es: Esta descripción de la API
      x-greenlens-role: public
      security: []
      responses:
        "200":
          description: The OpenAPI document.
          x-description-es: El documento OpenAPI.
          content:
            application/yaml:
              schema: {type: string}
  /api/v1/status:
    get:
      operationId: status
      tags: [measurements]
      summary: State of the node, its sources and backends
      x-summary-es: Estado del nodo, sus fuentes y backends
      x-greenlens-role: viewer
      responses:
        "200":
          description: The state of the node.
          x-description-es: El estado del nodo.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Status"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/sources:
    get:
      operationId: sources
      tags: [measurements]
      summary: Energy channels found, chosen and discarded
      x-summary-es: Canales de energía encontrados, elegidos y descartados
      x-greenlens-role: viewer
      responses:
        "200":
          description: Every probed channel with the decision about it.
          x-description-es: Cada canal probado con la decisión sobre él.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Channel"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/usage:
    get:
      operationId: usage
      tags: [measurements]
      summary: Energy of a period, by channel or by backend, model or consumer
      x-summary-es: Energía de un periodo, por canal o por backend, modelo o consumidor
      description: >-
        Without group_by, the energy of every channel in buckets. With group_by,
        the energy, tokens and requests of each backend, model or consumer.
      x-description-es: >-
        Sin group_by, la energía de cada canal en intervalos. Con group_by, la
        energía, los tokens y las solicitudes de cada backend, modelo o
        consumidor.
      x-greenlens-role: viewer
      parameters:
        - name: from
          in: query
          required: true
          description: Start of the period, RFC 3339.
          x-description-es: Inicio del periodo, RFC 3339.
          schema: {type: string, format: date-time}
        - name: to
          in: query
          required: true
          description: End of the period, RFC 3339, at most three years after from.
          x-description-es: Fin del periodo, RFC 3339, a lo sumo tres años después de from.
          schema: {type: string, format: date-time}
        - name: bucket
          in: query
          description: Size of each bucket, such as 1m or 1h, at least 1m, also with group_by. Without it, one total.
          x-description-es: Tamaño de cada intervalo, como 1m o 1h, al menos 1m, también con group_by. Sin él, un solo total.
          schema: {type: string}
        - name: group_by
          in: query
          description: Group by backend, model or consumer instead of by channel.
          x-description-es: Agrupa por backend, modelo o consumidor en lugar de por canal.
          schema: {type: string, enum: [backend, model, consumer]}
      responses:
        "200":
          description: Usage by channel, or by group when group_by is set.
          x-description-es: Consumo por canal, o por grupo cuando se indica group_by.
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: "#/components/schemas/Usage"}
                  - {$ref: "#/components/schemas/BackendUsage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/v1/backends:
    get:
      operationId: backends
      tags: [measurements]
      summary: Backends and models with their use since the agent started
      x-summary-es: Backends y modelos con su uso desde que inició el agente
      x-greenlens-role: viewer
      responses:
        "200":
          description: The backends of the node.
          x-description-es: Los backends del nodo.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Backends"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/live:
    get:
      operationId: live
      tags: [measurements]
      summary: Power of every domain over the last minutes
      x-summary-es: Potencia de cada dominio en los últimos minutos
      x-greenlens-role: viewer
      responses:
        "200":
          description: The samples kept in memory, at most 15 minutes.
          x-description-es: Las muestras que se conservan en memoria, a lo sumo 15 minutos.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Live"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/stream:
    get:
      operationId: stream
      tags: [measurements]
      summary: Live power and use of the backends as server-sent events
      x-summary-es: Potencia en vivo y uso de los backends como eventos enviados por el servidor
      description: >-
        A sample event, whose data is a LivePoint and whose id grows by one with
        each sample, follows every sample of the agent; a backends event, whose
        data is a Backends document, follows every usage interval; a benchmark
        event, whose data is a BenchmarkJob, follows every change of the
        benchmark run by the agent. A comment
        keeps the connection open every 15 seconds. A client that reconnects
        with Last-Event-ID receives the samples it missed while they are still
        in memory, at most 15 minutes. A client that falls behind is
        disconnected and resumes the same way.
      x-description-es: >-
        Un evento sample, cuyos datos son un LivePoint y cuyo id crece de uno en
        uno con cada muestra, sigue a cada muestra del agente; un evento
        backends, cuyos datos son un documento Backends, sigue a cada intervalo
        de uso; un evento benchmark, cuyos datos son un BenchmarkJob, sigue a
        cada cambio del benchmark que ejecuta el agente. Un comentario mantiene abierta la conexión cada 15 segundos. Un
        cliente que se reconecta con Last-Event-ID recibe las muestras que se
        perdió mientras sigan en memoria, a lo sumo 15 minutos. Un cliente que
        se atrasa se desconecta y continúa de la misma forma.
      x-greenlens-role: viewer
      parameters:
        - name: Last-Event-ID
          in: header
          description: Id of the last sample received.
          x-description-es: Id de la última muestra recibida.
          schema: {type: integer, minimum: 0}
        - name: last_event_id
          in: query
          description: Id of the last sample received, for clients that cannot set headers.
          x-description-es: Id de la última muestra recibida, para clientes que no pueden poner cabeceras.
          schema: {type: integer, minimum: 0}
      responses:
        "200":
          description: The stream of events.
          x-description-es: El flujo de eventos.
          content:
            text/event-stream:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503":
          description: Too many live clients.
          x-description-es: Demasiados clientes en vivo.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/calibrations:
    post:
      operationId: saveCalibration
      tags: [measurements]
      summary: Store a calibration of the idle power and apply it
      x-summary-es: Guarda una calibración de la potencia en reposo y la aplica
      x-greenlens-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Calibration"}
      responses:
        "201":
          description: The stored calibration, now in force.
          x-description-es: La calibración guardada, ya vigente.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Calibration"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/v1/benchmarks:
    get:
      operationId: benchmarks
      tags: [benchmarks]
      summary: Stored benchmarks, newest first
      x-summary-es: Benchmarks guardados, del más reciente al más antiguo
      x-greenlens-role: viewer
      parameters:
        - name: limit
          in: query
          description: Most benchmarks to return, 1 to 1000; 50 by default.
          x-description-es: Máximo de benchmarks a devolver, de 1 a 1000; 50 por defecto.
          schema: {type: integer, minimum: 1, maximum: 1000}
      responses:
        "200":
          description: The benchmarks.
          x-description-es: Los benchmarks.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Benchmarks"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/ServerError"}
    post:
      operationId: startBenchmark
      tags: [benchmarks]
      summary: Run a benchmark in the agent
      x-summary-es: Ejecuta un benchmark en el agente
      description: >-
        The agent runs one benchmark at a time with the embedded prompt set, measures
        it with its own samples, stores it and records it in the audit log. Its
        progress comes as benchmark events of the live stream.
      x-description-es: >-
        El agente ejecuta un benchmark a la vez con el conjunto de prompts incluido,
        lo mide con sus propias muestras, lo guarda y lo registra en la auditoría.
        Su avance llega como eventos benchmark del flujo en vivo.
      x-greenlens-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BenchmarkRequest"}
      responses:
        "202":
          description: The benchmark started.
          x-description-es: El benchmark comenzó.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BenchmarkJob"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: A benchmark is already running.
          x-description-es: Ya hay un benchmark en ejecución.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/benchmarks/run:
    get:
      operationId: benchmarkRun
      tags: [benchmarks]
      summary: State of the benchmark run by the agent
      x-summary-es: Estado del benchmark que ejecuta el agente
      x-greenlens-role: viewer
      responses:
        "200":
          description: The state.
          x-description-es: El estado.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BenchmarkJob"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    delete:
      operationId: cancelBenchmark
      tags: [benchmarks]
      summary: Cancel the benchmark run by the agent
      x-summary-es: Cancela el benchmark que ejecuta el agente
      x-greenlens-role: operator
      responses:
        "202":
          description: The benchmark is stopping.
          x-description-es: El benchmark se está deteniendo.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BenchmarkJob"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: No benchmark is running.
          x-description-es: No hay ningún benchmark en ejecución.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /api/v1/benchmarks/results:
    post:
      operationId: saveBenchmark
      tags: [benchmarks]
      summary: Store the result of a benchmark measured elsewhere, as greenlens bench does
      x-summary-es: Guarda el resultado de un benchmark medido en otro lado, como hace greenlens bench
      x-greenlens-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Benchmark"}
      responses:
        "201":
          description: The stored benchmark with its id.
          x-description-es: El benchmark guardado con su id.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Benchmark"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/v1/benchmarks/{id}:
    get:
      operationId: benchmark
      tags: [benchmarks]
      summary: One stored benchmark
      x-summary-es: Un benchmark guardado
      x-greenlens-role: viewer
      parameters:
        - name: id
          in: path
          required: true
          description: Id of the benchmark.
          x-description-es: Id del benchmark.
          schema: {type: integer, minimum: 1}
      responses:
        "200":
          description: The benchmark.
          x-description-es: El benchmark.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Benchmark"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/v1/backup:
    get:
      operationId: backup
      tags: [administration]
      summary: Consistent copy of the database
      x-summary-es: Copia consistente de la base de datos
      x-greenlens-role: admin
      responses:
        "200":
          description: A SQLite database file.
          x-description-es: Un archivo de base de datos SQLite.
          headers:
            X-GreenLens-Schema-Version:
              description: Schema version of the copy.
              x-description-es: Versión de esquema de la copia.
              schema: {type: integer}
          content:
            application/vnd.sqlite3:
              schema: {type: string, contentEncoding: binary}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/v1/tokens:
    get:
      operationId: tokens
      tags: [access]
      summary: Access tokens, without their secrets
      x-summary-es: Tokens de acceso, sin sus secretos
      x-greenlens-role: admin
      responses:
        "200":
          description: The tokens.
          x-description-es: Los tokens.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Tokens"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: createToken
      tags: [access]
      summary: Create an access token
      x-summary-es: Crea un token de acceso
      x-greenlens-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateToken"}
      responses:
        "201":
          description: The token and its secret, shown only in this answer.
          x-description-es: El token y su secreto, que solo se muestra en esta respuesta.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreatedToken"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/v1/tokens/{id}:
    delete:
      operationId: revokeToken
      tags: [access]
      summary: Revoke an access token
      x-summary-es: Revoca un token de acceso
      x-greenlens-role: admin
      parameters:
        - name: id
          in: path
          required: true
          description: Id or name of the token.
          x-description-es: Id o nombre del token.
          schema: {type: string}
      responses:
        "200":
          description: The revoked token.
          x-description-es: El token revocado.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Token"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/v1/audit:
    get:
      operationId: audit
      tags: [administration]
      summary: Actions of operators and administrators, newest first
      x-summary-es: Acciones de operadores y administradores, de la más reciente a la más antigua
      x-greenlens-role: admin
      parameters:
        - name: limit
          in: query
          description: Most entries to return, 1 to 1000; 100 by default.
          x-description-es: Máximo de entradas a devolver, de 1 a 1000; 100 por defecto.
          schema: {type: integer, minimum: 1, maximum: 1000}
        - name: before
          in: query
          description: Return entries older than the entry with this id.
          x-description-es: Devuelve las entradas anteriores a la que tiene este id.
          schema: {type: integer, minimum: 1}
      responses:
        "200":
          description: The audit log.
          x-description-es: El registro de auditoría.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Audit"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/v1/help:
    get:
      operationId: help
      tags: [health]
      summary: Pages of the embedded documentation, or a search of them
      x-summary-es: Páginas de la documentación incluida, o una búsqueda en ellas
      x-greenlens-role: viewer
      parameters:
        - name: lang
          in: query
          description: Language, such as en or es; English when missing or unknown.
          x-description-es: Idioma, como en o es; inglés si falta o es desconocido.
          schema: {type: string}
        - name: q
          in: query
          description: Words to search; without it, the index.
          x-description-es: Palabras a buscar; sin ellas, el índice.
          schema: {type: string, maxLength: 200}
      responses:
        "200":
          description: The index, or the pages that contain every word.
          x-description-es: El índice, o las páginas que contienen todas las palabras.
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: "#/components/schemas/HelpIndex"}
                  - {$ref: "#/components/schemas/HelpSearch"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/help/{page}:
    get:
      operationId: helpPage
      tags: [health]
      summary: One page of the embedded documentation, rendered to HTML
      x-summary-es: Una página de la documentación incluida, convertida a HTML
      description: >-
        The page may contain slashes, as guides/agent. Raw HTML of the sources is
        dropped, and links between pages become routes of the interface such as
        #/help/guides/agent.
      x-description-es: >-
        La página puede contener barras, como guides/agent. El HTML crudo de las
        fuentes se descarta, y los enlaces entre páginas se convierten en rutas de
        la interfaz como #/help/guides/agent.
      x-greenlens-role: viewer
      parameters:
        - name: page
          in: path
          required: true
          description: Path of the page.
          x-description-es: Ruta de la página.
          schema: {type: string}
        - name: lang
          in: query
          description: Language; a page without a translation comes in English.
          x-description-es: Idioma; una página sin traducción llega en inglés.
          schema: {type: string}
      responses:
        "200":
          description: The page.
          x-description-es: La página.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HelpPage"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/config:
    get:
      operationId: config
      tags: [administration]
      summary: The configuration in force and its file
      x-summary-es: La configuración vigente y su archivo
      x-greenlens-role: admin
      responses:
        "200":
          description: The configuration.
          x-description-es: La configuración.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConfigDoc"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "500": {$ref: "#/components/responses/ServerError"}
    put:
      operationId: applyConfig
      tags: [administration]
      summary: Change the configuration file and reload it
      x-summary-es: Cambia el archivo de configuración y lo recarga
      description: >-
        Only when the agent can write its file, as an agent run by a user can; the
        system service cannot, and its file is installed with the previewed content
        instead. Comments of the file are kept.
      x-description-es: >-
        Solo cuando el agente puede escribir su archivo, como puede un agente
        ejecutado por un usuario; el servicio del sistema no puede, y su archivo se
        instala con el contenido de la vista previa. Los comentarios del archivo se
        conservan.
      x-greenlens-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConfigChange"}
      responses:
        "200":
          description: The file was written and the configuration reloaded.
          x-description-es: Se escribió el archivo y se recargó la configuración.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConfigPreview"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: The agent cannot write its configuration file.
          x-description-es: El agente no puede escribir su archivo de configuración.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422":
          description: The changes make the configuration invalid; nothing was written.
          x-description-es: Los cambios vuelven inválida la configuración; no se escribió nada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConfigPreview"}
        "500": {$ref: "#/components/responses/ServerError"}
  /api/v1/config/preview:
    post:
      operationId: previewConfig
      tags: [administration]
      summary: The configuration file that changes would produce, checked
      x-summary-es: El archivo de configuración que producirían los cambios, revisado
      x-greenlens-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConfigChange"}
      responses:
        "200":
          description: The resulting file and its problems.
          x-description-es: El archivo resultante y sus problemas.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConfigPreview"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/session:
    get:
      operationId: session
      tags: [access]
      summary: Who sends the request, and the CSRF token of a session
      x-summary-es: Quién envía la solicitud, y el token CSRF de una sesión
      x-greenlens-role: public
      security: []
      responses:
        "200":
          description: The principal of the request.
          x-description-es: El principal de la solicitud.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      operationId: signIn
      tags: [access]
      summary: Open a browser session with an access token
      x-summary-es: Abre una sesión del navegador con un token de acceso
      x-greenlens-role: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Login"}
      responses:
        "200":
          description: The session; its cookie is set.
          x-description-es: La sesión; se establece su cookie.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "500": {$ref: "#/components/responses/ServerError"}
    delete:
      operationId: signOut
      tags: [access]
      summary: End the browser session
      x-summary-es: Termina la sesión del navegador
      x-greenlens-role: public
      security: []
      responses:
        "204":
          description: The session ended and its cookie was cleared.
          x-description-es: La sesión terminó y se borró su cookie.
  /api/v1/session/codes:
    post:
      operationId: sessionCode
      tags: [access]
      summary: One-time sign-in link for a local user
      x-summary-es: Enlace de inicio de sesión de un solo uso para un usuario local
      description: Served only on the Unix socket, for greenlens gui.
      x-description-es: Solo se atiende en el socket Unix, para greenlens gui.
      x-greenlens-role: admin
      x-greenlens-socket-only: true
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SessionCodeRequest"}
      responses:
        "200":
          description: The link, valid for two minutes.
          x-description-es: El enlace, válido por dos minutos.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionCode"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409":
          description: The HTTP API is disabled.
          x-description-es: La API HTTP está desactivada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500": {$ref: "#/components/responses/ServerError"}
  /login:
    get:
      operationId: signInWithCode
      tags: [access]
      summary: Redeem a one-time sign-in link
      x-summary-es: Usa un enlace de inicio de sesión de un solo uso
      x-greenlens-role: public
      security: []
      parameters:
        - name: code
          in: query
          required: true
          description: The code of the link.
          x-description-es: El código del enlace.
          schema: {type: string}
      responses:
        "303":
          description: Redirects to the interface, with a session cookie when the code was valid.
          x-description-es: Redirige a la interfaz, con una cookie de sesión si el código era válido.

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An access token created with greenlens token create.
      x-description-es: Un token de acceso creado con greenlens token create.
    session:
      type: apiKey
      in: cookie
      name: greenlens_session
      description: >-
        A browser session. Requests that change something also need the header
        X-GreenLens-CSRF with the csrf of GET /api/v1/session.
      x-description-es: >-
        Una sesión del navegador. Las solicitudes que cambian algo también
        necesitan la cabecera X-GreenLens-CSRF con el csrf de GET /api/v1/session.
  responses:
    BadRequest:
      description: The request is not valid.
      x-description-es: La solicitud no es válida.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: No valid session or token.
      x-description-es: No hay una sesión o un token válidos.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: The role is not enough, or the CSRF check failed.
      x-description-es: El rol no alcanza, o falló la comprobación CSRF.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: Nothing has this id.
      x-description-es: Nada tiene este id.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    ServerError:
      description: The agent could not complete the request; its log has the details.
      x-description-es: El agente no pudo completar la solicitud; su registro tiene los detalles.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    TooManyRequests:
      description: Too many requests from this address.
      x-description-es: Demasiadas solicitudes desde esta dirección.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}

  schemas:
    Error:
      type: object
      description: Returned with every error status.
      x-description-es: Se devuelve con cada estado de error.
      additionalProperties: false
      required: [error]
      properties:
        error: {type: string, description: What went wrong., x-description-es: Qué salió mal.}

    Status:
      type: object
      description: State of the node.
      x-description-es: Estado del nodo.
      additionalProperties: false
      required: [schema_version, version, started_at, interval_ms, sample_time, samples, estimated, domains, channels, self, idle_policy, factors, cpu_joules_per_busy_second]
      properties:
        schema_version: {type: integer, description: Version of the document., x-description-es: Versión del documento.}
        version: {type: string, description: Version of the agent., x-description-es: Versión del agente.}
        started_at: {type: string, format: date-time, description: When the agent started., x-description-es: Cuándo inició el agente.}
        interval_ms: {type: integer, description: Sampling interval in milliseconds., x-description-es: Intervalo de muestreo en milisegundos.}
        sample_time: {type: string, format: date-time, description: Time of the latest sample., x-description-es: Hora de la última muestra.}
        samples: {type: integer, description: Samples taken since the start., x-description-es: Muestras tomadas desde el inicio.}
        estimated: {type: boolean, description: Whether processor energy is estimated rather than measured., x-description-es: Si la energía del procesador es estimada en lugar de medida.}
        domains:
          type: array
          description: Power and energy of every domain.
          x-description-es: Potencia y energía de cada dominio.
          items: {$ref: "#/components/schemas/Domain"}
        channels:
          type: array
          description: Every probed channel with the decision about it.
          x-description-es: Cada canal probado con la decisión sobre él.
          items: {$ref: "#/components/schemas/Channel"}
        problems:
          type: array
          description: Problems found in the sources.
          x-description-es: Problemas encontrados en las fuentes.
          items: {$ref: "#/components/schemas/Problem"}
        calibration: {$ref: "#/components/schemas/CalibrationSummary"}
        self: {$ref: "#/components/schemas/Self"}
        idle_policy: {type: string, enum: [dynamic, proportional, full, wall], description: How idle power is shared., x-description-es: Cómo se reparte la potencia en reposo.}
        factors: {$ref: "#/components/schemas/Factors"}
        cpu_joules_per_busy_second: {type: number, description: Energy of one busy processor second over about the last minute; without idle power when the node is calibrated., x-description-es: Energía de un segundo de procesador ocupado en aproximadamente el último minuto; sin la potencia en reposo cuando el nodo está calibrado.}
        backends:
          type: array
          description: Backends of the node.
          x-description-es: Backends del nodo.
          items: {$ref: "#/components/schemas/Backend"}
        proxy: {$ref: "#/components/schemas/Proxy"}

    Factors:
      type: object
      description: Conversion factors in force, to turn energy into emissions, cost and water as the agent does.
      x-description-es: Factores de conversión vigentes, para convertir la energía en emisiones, costo y agua como lo hace el agente.
      additionalProperties: false
      required: [emission_g_per_kwh, emission_source, pue, currency]
      properties:
        emission_g_per_kwh: {type: number, description: Grid emission factor in gCO2e per kWh., x-description-es: Factor de emisión de la red en gCO2e por kWh.}
        emission_source: {type: string, description: Where the emission factor comes from., x-description-es: De dónde viene el factor de emisión.}
        pue: {type: number, description: Power usage effectiveness of the facility., x-description-es: Eficiencia en el uso de energía de la instalación.}
        tariff_per_kwh: {type: number, description: Price of a kWh; absent when no tariff is configured., x-description-es: Precio de un kWh; ausente si no hay tarifa configurada.}
        currency: {type: string, description: ISO 4217 code of the tariff., x-description-es: Código ISO 4217 de la tarifa.}
        wue_l_per_kwh: {type: number, description: Water in liters per kWh; absent when not configured., x-description-es: Agua en litros por kWh; ausente si no está configurada.}

    About:
      type: object
      description: The running version, its license and its source code.
      x-description-es: La versión en ejecución, su licencia y su código fuente.
      additionalProperties: false
      required: [schema_version, license, copyright, version, source_url, modified, commercial_contact, third_party]
      properties:
        schema_version: {type: integer, description: Version of the document., x-description-es: Versión del documento.}
        license: {type: string, description: SPDX identifier of the license., x-description-es: Identificador SPDX de la licencia.}
        copyright: {type: string, description: Copyright notice., x-description-es: Aviso de derechos de autor.}
        version: {type: string, description: Version of the agent., x-description-es: Versión del agente.}
        revision: {type: string, description: Commit the agent was built from., x-description-es: Commit desde el que se compiló el agente.}
        source_url: {type: string, description: Source code of this version., x-description-es: Código fuente de esta versión.}
        modified: {type: boolean, description: Whether it was built from modified source code., x-description-es: Si se compiló a partir de código fuente modificado.}
        commercial_contact: {type: string, description: Where to ask for the commercial license., x-description-es: Dónde pedir la licencia comercial.}
        third_party:
          type: array
          description: Third-party components included.
          x-description-es: Componentes de terceros incluidos.
          items:
            type: object
            description: A component and its version.
            x-description-es: Un componente y su versión.
            additionalProperties: false
            required: [name, version]
            properties:
              name: {type: string, description: Name of the component., x-description-es: Nombre del componente.}
              version: {type: string, description: Version of the component., x-description-es: Versión del componente.}

    ConfigField:
      type: object
      description: One key of the configuration with its value in force, written as for its environment variable.
      x-description-es: Una clave de la configuración con su valor vigente, escrito como para su variable de entorno.
      additionalProperties: false
      required: [key, type, value, default]
      properties:
        key: {type: string, description: Dotted key., x-description-es: Clave con puntos.}
        type: {type: string, description: Type of the value., x-description-es: Tipo del valor.}
        value: {type: string, description: Value in force., x-description-es: Valor vigente.}
        default: {type: string, description: Default value., x-description-es: Valor por defecto.}
        env: {type: string, description: Environment variable that overrides it., x-description-es: Variable de entorno que lo reemplaza.}
        enum:
          type: array
          description: Accepted values, when they are a fixed set.
          x-description-es: Valores aceptados, cuando son un conjunto fijo.
          items: {type: string}

    ConfigDoc:
      type: object
      description: The configuration of the agent and whether it can change its file.
      x-description-es: La configuración del agente y si puede cambiar su archivo.
      additionalProperties: false
      required: [schema_version, path, writable, yaml, fields, restart_keys]
      properties:
        schema_version: {type: integer, description: Version of the document., x-description-es: Versión del documento.}
        path: {type: string, description: File the agent read; empty when it runs with the defaults., x-description-es: Archivo que leyó el agente; vacío si usa los valores por defecto.}
        writable: {type: boolean, description: Whether the agent can write the file., x-description-es: Si el agente puede escribir el archivo.}
        reason: {type: string, enum: [no_file, read_only], description: Why the file cannot be written., x-description-es: Por qué no se puede escribir el archivo.}
        yaml: {type: string, description: Content of the file., x-description-es: Contenido del archivo.}
        fields:
          type: array
          description: Every key except lists of objects such as backends.
          x-description-es: Todas las claves salvo las listas de objetos como backends.
          items: {$ref: "#/components/schemas/ConfigField"}
        restart_keys:
          type: array
          description: Keys, or prefixes ending in a dot, that change only after a restart.
          x-description-es: Claves, o prefijos que terminan en punto, que cambian solo tras reiniciar.
          items: {type: string}

    ConfigChange:
      type: object
      description: New values for keys of the configuration, written as for their environment variable; an empty value clears a number.
      x-description-es: Valores nuevos para claves de la configuración, escritos como para su variable de entorno; un valor vacío quita un número.
      additionalProperties: false
      required: [changes]
      properties:
        changes:
          type: object
          description: Values by key.
          x-description-es: Valores por clave.
          additionalProperties: {type: string}

    ConfigPreview:
      type: object
      description: The file that changes produce and its problems.
      x-description-es: El archivo que producen los cambios y sus problemas.
      additionalProperties: false
      required: [schema_version, yaml, valid, errors, needs_restart, applied]
      properties:
        schema_version: {type: integer, description: Version of the document., x-description-es: Versión del documento.}
        yaml: {type: string, description: The resulting file., x-description-es: El archivo resultante.}
        valid: {type: boolean, description: Whether the agent would accept it., x-description-es: Si el agente lo aceptaría.}
        errors:
          type: array
          description: Problems, by key when they concern one.
          x-description-es: Problemas, por clave cuando se refieren a una.
          items:
            type: object
            description: A problem.
            x-description-es: Un problema.
            additionalProperties: false
            required: [message]
            properties:
              key: {type: string, description: The key., x-description-es: La clave.}
              message: {type: string, description: What is wrong., x-description-es: Qué está mal.}
        needs_restart: {type: boolean, description: Whether some change takes effect only after a restart., x-description-es: Si algún cambio surte efecto solo tras reiniciar.}
        applied: {type: boolean, description: Whether the file was written and reloaded., x-description-es: Si se escribió el archivo y se recargó.}

    HelpIndex:
      type: object
      description: The pages of the embedded documentation, by section and order.
      x-description-es: Las páginas de la documentación incluida, por sección y orden.
      additionalProperties: false
      required: [schema_version, lang, sections, pages]
      properties:
        schema_version: {type: integer, description: Version of the document., x-description-es: Versión del documento.}
        lang: {type: string, description: Language of the pages., x-description-es: Idioma de las páginas.}
        sections:
          type: array
          description: Sections, in order.
          x-description-es: Secciones, en orden.
          items: {type: string}
        pages:
          type: array
          description: The pages.
          x-description-es: Las páginas.
          items:
            type: object
            description: A page.
            x-description-es: Una página.
            additionalProperties: false
            required: [path, section, title]
            properties:
              path: {type: string, description: Path of the page; a section has the path of its name., x-description-es: Ruta de la página; una sección tiene la ruta de su nombre.}
              section: {type: string, description: Section of the page., x-description-es: Sección de la página.}
              title: {type: string, description: Title., x-description-es: Título.}
              description: {type: string, description: What the page covers., x-description-es: Qué cubre la página.}

    HelpSearch:
      type: object
      description: The pages that contain every word of a search, the best first.
      x-description-es: Las páginas que contienen todas las palabras de una búsqueda, la mejor primero.
      additionalProperties: false
      required: [schema_version, lang, query, results]
      properties:
        schema_version: {type: integer, description: Version of the document., x-description-es: Versión del documento.}
        lang: {type: string, description: Language searched., x-description-es: Idioma buscado.}
        query: {type: string, description: The search., x-description-es: La búsqueda.}
        results:
          type: array
          description: At most 20 pages.
          x-description-es: A lo sumo 20 páginas.
          items:
            type: object
            description: A page that matches.
            x-description-es: Una página que coincide.
            additionalProperties: false
            required: [path, title, snippet]
            properties:
              path: {type: string, description: Path of the page., x-description-es: Ruta de la página.}
              title: {type: string, description: Title., x-description-es: Título.}
              snippet: {type: string, description: Text around the first match., x-description-es: Texto alrededor de la primera coincidencia.}

    HelpPage:
      type: object
      description: One page of the documentation rendered to HTML.
      x-description-es: Una página de la documentación convertida a HTML.
      additionalProperties: false
      required: [schema_version, lang, path, title, html]
      properties:
        schema_version: {type: integer, description: Version of the document., x-description-es: Versión del documento.}
        lang: {type: string, description: Language of the page., x-description-es: Idioma de la página.}
        path: {type: string, description: Path of the page., x-description-es: Ruta de la página.}
        title: {type: string, description: Title., x-description-es: Título.}
        html: {type: string, description: The page in HTML, without raw HTML of the sources., x-description-es: La página en HTML, sin el HTML crudo de las fuentes.}

    Catalog:
      type: object
      description: Messages of one language for the graphical interface, with placeholders written as {name}.
      x-description-es: Mensajes de un idioma para la interfaz gráfica, con marcadores escritos como {name}.
      additionalProperties: false
      required: [schema_version, lang, languages, messages]
      properties:
        schema_version: {type: integer, description: Version of the document., x-description-es: Versión del documento.}
        lang: {type: string, description: Language of the messages., x-description-es: Idioma de los mensajes.}
        languages:
          type: array
          description: Every language available.
          x-description-es: Todos los idiomas disponibles.
          items: {type: string}
        messages:
          type: object
          description: Messages by key.
          x-description-es: Mensajes por clave.
          additionalProperties: {type: string}

    Domain:
      type: object
      description: Power of one domain in the latest sample and its energy since the start.
      x-description-es: Potencia de un dominio en la última muestra y su energía desde el inicio.
      additionalProperties: false
      required: [domain, level, power_w, energy_j, quality]
      properties:
        domain: {type: string, description: Domain, such as package, dram or gpu., x-description-es: Dominio, como package, dram o gpu.}
        level: {type: string, enum: [component, system, wall], description: Component, system or wall meter level., x-description-es: Nivel de componente, de sistema o de medidor de pared.}
        power_w: {type: number, description: Power in watts., x-description-es: Potencia en watts.}
        energy_j: {type: number, description: Energy in joules since the agent started., x-description-es: Energía en joules desde que inició el agente.}
        quality: {type: string, description: Quality of the measurement., x-description-es: Calidad de la medición.}

    Channel:
      type: object
      description: A channel probed by the agent and the decision about it.
      x-description-es: Un canal probado por el agente y la decisión sobre él.
      additionalProperties: false
      required: [id, source, domain, quality, method, selected, reason]
      properties:
        id: {type: string, description: Identifier of the channel., x-description-es: Identificador del canal.}
        source: {type: string, description: Source that reads it., x-description-es: Fuente que lo lee.}
        domain: {type: string, description: Domain it measures., x-description-es: Dominio que mide.}
        instance: {type: string, description: Package, card or device it belongs to., x-description-es: Paquete, tarjeta o dispositivo al que pertenece.}
        quality: {type: string, description: Quality of its values., x-description-es: Calidad de sus valores.}
        method: {type: string, description: How the source obtains energy., x-description-es: Cómo obtiene la fuente la energía.}
        label: {type: string, description: Label reported by the hardware., x-description-es: Etiqueta que reporta el hardware.}
        selected: {type: boolean, description: Whether its values are used., x-description-es: Si se usan sus valores.}
        reason: {type: string, description: Key of the reason for the decision., x-description-es: Clave del motivo de la decisión.}
        reason_args:
          type: object
          description: Values that complete the reason.
          x-description-es: Valores que completan el motivo.
          additionalProperties: {type: string}

    Problem:
      type: object
      description: A problem with a code of the GLxxxx catalog and its values.
      x-description-es: Un problema con un código del catálogo GLxxxx y sus valores.
      additionalProperties: false
      required: [code]
      properties:
        code: {type: string, pattern: "^GL[0-9]{4}$", description: Error code., x-description-es: Código de error.}
        args:
          type: object
          description: Values that complete the message.
          x-description-es: Valores que completan el mensaje.
          additionalProperties: {type: string}
        channel: {type: string, description: Channel it concerns., x-description-es: Canal al que se refiere.}
        backend: {type: string, description: Backend it concerns., x-description-es: Backend al que se refiere.}

    Baseline:
      type: object
      description: Idle power of each part of the node.
      x-description-es: Potencia en reposo de cada parte del nodo.
      additionalProperties: false
      required: [cpu_w, dram_w, platform_w]
      properties:
        cpu_w: {type: number, description: Idle power of the processor packages., x-description-es: Potencia en reposo de los paquetes del procesador.}
        dram_w: {type: number, description: Idle power of the memory., x-description-es: Potencia en reposo de la memoria.}
        platform_w: {type: number, description: Idle power of the platform or wall meter., x-description-es: Potencia en reposo de la plataforma o del medidor de pared.}
        gpu_w:
          type: object
          description: Idle power of each GPU by PCI address.
