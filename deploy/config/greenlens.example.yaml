# GreenLens configuration. Every key is optional; the values below are the
# defaults. Install as /etc/greenlens/greenlens.yaml for the system agent, or
# as ~/.config/greenlens/greenlens.yaml for a user. Unknown keys are errors.

agent:
  # How often energy is sampled, from 50ms to 60s.
  sample_interval: 1s
  # Where the database lives. Empty: /var/lib/greenlens for the system
  # service, $XDG_DATA_HOME/greenlens for a user.
  data_dir: ""
  # Unix socket of the agent. Empty: /run/greenlens/greenlens.sock for the
  # system service, $XDG_RUNTIME_DIR/greenlens/greenlens.sock for a user.
  socket: ""
  # Root of the host file system; "/host" when running in a container with
  # the host root mounted there.
  host_root: /

sources:
  # Choose sources automatically. When false, only the sources named in
  # force are used.
  auto: true
  # Sources never used: rapl, perf_event, hwmon, acpi_power_meter, ipmi,
  # battery, estimate.
  disable: []
  # Source preferred for a domain (package, dram, psys, platform), for
  # example {package: perf_event}.
  force: {}
  rapl:
    # Shortest sampling interval accepted. Raise it to lower the time
    # resolution of the RAPL counters if the security policy requires it.
    min_interval: 50ms
  estimate:
    # Power of the whole CPU at 0% and 100% utilization, used when no
    # energy counter is readable. 0 uses the embedded table.
    idle_watts: 0
    full_watts: 0
    # Exponent of the utilization in the model; 1 is linear.
    exponent: 1

attribution:
  # How idle energy is attributed: dynamic, proportional, full or wall.
  idle_policy: dynamic

indicators:
  # Grid emission factor in gCO2e/kWh. Empty: FESEN 2024, 444 gCO2e/kWh.
  # When set, emission_factor_source must say where it comes from.
  emission_factor_g_per_kwh:
  emission_factor_source: ""
  # Power usage effectiveness of the facility; 1.0 for no overhead.
  pue: 1.0
  # Water usage effectiveness in liters per kWh. Empty: water is not
  # reported.
  wue_l_per_kwh:
  tariff:
    # Price of electricity per kWh. Empty: cost is not reported.
    price_per_kwh:
    currency: MXN

retention:
  raw: 168h
  rollup_1m: 2160h
  rollup_1h: 17520h

logging:
  # debug, info, warn or error.
  level: info
  # json or text.
  format: json
