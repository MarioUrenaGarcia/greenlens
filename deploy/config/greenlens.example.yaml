# GreenLens configuration. Every key is optional; the values below are the
# defaults. Install as /etc/greenlens/greenlens.yaml for the system agent, or
# as ~/.config/greenlens/greenlens.yaml for a user. Unknown keys are errors.

agent:
  # How often energy is sampled, from 50ms to 60s.
  sample_interval: 1s
  # Where the database lives. Empty: /var/lib/greenlens for the system
  # service, $XDG_DATA_HOME/greenlens for a user.
  data_dir: ""
  # Unix socket of the agent. Empty: /run/greenlens/greenlens.sock for the
  # system service, $XDG_RUNTIME_DIR/greenlens/greenlens.sock for a user.
  socket: ""
  # Root of the host file system; "/host" when running in a container with
  # the host root mounted there.
  host_root: /

sources:
  # Choose sources automatically. When false, only the sources named in
  # force are used.
  auto: true
  # Sources never used: rapl, perf_event, hwmon, hwmon_gpu, nvml,
  # nvidia_smi, acpi_power_meter, ipmi, battery, estimate.
  disable: []
  # Source preferred for a domain (package, dram, gpu, psys, platform), for
  # example {package: perf_event}.
  force: {}
  rapl:
    # Shortest sampling interval accepted. Raise it to lower the time
    # resolution of the RAPL counters if the security policy requires it.
    min_interval: 50ms
  nvml:
    # Path of greenlens-nvml, the helper that reads NVIDIA GPUs. Empty looks
    # next to greenlens, then in /usr/libexec/greenlens and /usr/lib/greenlens.
    helper: ""
  estimate:
    # Power of the whole CPU at 0% and 100% utilization, used when no
    # energy counter is readable. 0 uses the embedded table.
    idle_watts: 0
    full_watts: 0
    # Exponent of the utilization in the model; 1 is linear.
    exponent: 1

attribution:
  # How idle energy is attributed: dynamic, proportional, full or wall.
  idle_policy: dynamic
  # Most models tracked per backend; the energy of the others is reported
  # together as "other".
  max_models_per_backend: 50
  # Most consumers tracked by the proxy; the others are reported together
  # as "other".
  max_consumers: 200
  # Lowest R2 at which the energy of a prompt token and of a generated
  # token, fitted over the last 24 hours, is reported.
  regression_min_r2: 0.7

# Inference servers declared here keep their name across restarts and take
# precedence over the ones found by discovery. kind is one of ollama,
# llamacpp, vllm, tgi, sglang, localai, openai or process; a process backend
# names its executable in process instead of an endpoint.
backends: []
#  - name: vllm-main
#    kind: vllm
#    endpoint: http://127.0.0.1:8000
#  - name: ollama-dev
#    kind: ollama
#    endpoint: http://127.0.0.1:11434

discovery:
  # Look for known inference servers among the running processes.
  enabled: true
  # How often processes and listening ports are scanned, from 1s to 10m.
  interval: 10s

# A reverse proxy for servers that do not count tokens, such as Ollama and
# other OpenAI-compatible servers: it forwards requests unchanged, reads only
# the token counts of the responses and never stores or logs their content.
proxy:
  enabled: false
  listen: 127.0.0.1:11435
  upstream: http://127.0.0.1:11434
  # Add X-GreenLens-Energy-Joules to each response, as a trailer for
  # streamed ones.
  per_request_energy_header: false
  # Request header that tells consumers apart, such as Authorization. Its
  # value is kept only as an HMAC with a salt local to this machine.
  consumer_header: ""
  # YAML file mapping names to the SHA-256 of header values, such as
  # "team-a: sha256:<hex>", to report consumers by name.
  consumer_aliases_file: ""

# The HTTP API, the graphical interface and the Prometheus metrics. Requests
# need a session or an access token, except /healthz, /readyz and, unless
# metrics_auth is set, /metrics. Listening beyond loopback without any token
# is refused at start.
server:
  enabled: true
  listen: 127.0.0.1:10060
  # File of access tokens, kept as argon2id hashes. Empty: "tokens" in the
  # data directory, managed with "greenlens token".
  tokens_file: ""
  # Ask for a token on /metrics too.
  metrics_auth: false
  # Certificate and key in PEM. Without them the API speaks plain HTTP,
  # meant for loopback and SSH tunnels.
  tls:
    cert_file: ""
    key_file: ""

indicators:
  # Grid emission factor in gCO2e/kWh. Empty: FESEN 2024, 444 gCO2e/kWh.
  # When set, emission_factor_source must say where it comes from.
  emission_factor_g_per_kwh:
  emission_factor_source: ""
  # Absolute path of a CSV file with the intensity of the grid in each hour
  # of the week, which replaces the factor above hour by hour. Its first
  # line is "weekday,hour,g_co2e_per_kwh", followed by 168 lines with the
  # ISO weekday (1 Monday to 7 Sunday), the local hour (0 to 23) and the
  # intensity. Empty: the factor above applies to every hour.
  hourly_profile_file: ""
  # IANA time zone of the profile and of the tariff periods, such as
  # America/Mexico_City. Empty: the time zone of the system.
  timezone: ""
  # Power usage effectiveness of the facility; 1.0 for no overhead.
  pue: 1.0
  # Water usage effectiveness in liters per kWh. Empty: water is not
  # reported.
  wue_l_per_kwh:
  tariff:
    # Price of electricity per kWh. Empty: cost is not reported.
    price_per_kwh:
    currency: MXN
    # Time-of-use periods: the price on some weekdays between two local
    # times of the same day. price_per_kwh applies outside them; without
    # it, the periods must cover the whole week. Each period looks like:
    #   - days: [mon, tue, wed, thu, fri]
    #     from: "18:00"
    #     to: "22:00"
    #     price_per_kwh: <the price of the period>
    periods: []
  # Software Carbon Intensity (ISO/IEC 21031): the emissions per
  # functional unit, 1k_generated_tokens, request or consumer.
  sci:
    functional_unit: 1k_generated_tokens
    # Carbon of making the server and the GPU, in kgCO2e, from the product
    # carbon footprint of their makers, and their lifetime in years. Empty:
    # SCI is reported without embodied carbon, and says so.
    embodied:
      server_kgco2e:
      gpu_kgco2e:
      lifetime_years:

retention:
  raw: 168h
  rollup_1m: 2160h
  rollup_1h: 17520h

logging:
  # debug, info, warn or error.
  level: info
  # json or text.
  format: json
