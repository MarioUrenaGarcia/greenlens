#
# Scrapes the agent of this machine and the metrics the OpenTelemetry
# collector received from its OTLP export. Both jobs carry the same series,
# so the dashboard shows one or the other with its Node variable.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: greenlens
    static_configs:
      - targets: ["127.0.0.1:10060"]
  - job_name: greenlens-otlp
    static_configs:
      - targets: ["127.0.0.1:8889"]
