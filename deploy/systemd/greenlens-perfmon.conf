# Drop-in for /etc/systemd/system/greenlens.service.d/perfmon.conf: lets the
# agent read the RAPL counters through perf_event with the CAP_PERFMON
# capability, for systems where the powercap files cannot be shared with a
# group. Run "systemctl daemon-reload" after installing it.
[Service]
CapabilityBoundingSet=CAP_PERFMON
AmbientCapabilities=CAP_PERFMON
