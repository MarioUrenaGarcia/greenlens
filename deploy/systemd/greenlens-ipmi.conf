# Drop-in for /etc/systemd/system/greenlens.service.d/ipmi.conf: gives the
# agent the IPMI device, to read the server power from the BMC. The device
# also needs the group rule installed by
# "greenlens setup-permissions --ipmi".
[Service]
PrivateDevices=no
DeviceAllow=char-ipmidev rw
DevicePolicy=closed
