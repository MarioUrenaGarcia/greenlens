# Drop-in for /etc/systemd/system/greenlens.service.d/nvidia.conf: gives the
# agent and greenlens-nvml the NVIDIA devices that NVML opens to read energy,
# utilization and the processes of each GPU: the control and GPU nodes, the
# unified memory node and the capability nodes used to query MIG.
[Service]
PrivateDevices=no
DeviceAllow=char-nvidia rw
DeviceAllow=char-nvidia-uvm rw
DeviceAllow=char-nvidia-caps r
DevicePolicy=closed
